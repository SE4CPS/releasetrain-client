<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>releasetrain.io – Graph</title>
  <link rel="icon" href="https://releasetrain.io/img/favicon.png" type="image/png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <!-- Vendor -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>

  <!-- Sigma -->
  <script src="./../lib/sigma.min.js"></script>
  <script src="./../lib/sigma.canvas.edges.labels.curve.js"></script>
  <script src="./../lib/sigma.canvas.edges.labels.curvedArrow.js"></script>
  <script src="./../lib/sigma.canvas.edges.labels.def.js"></script>

  <style>
    :root { --panel-w: 360px; --border:#e8e8e8; --muted:#6b7280; --accent:#4f46e5; }

    * { box-sizing: border-box; }
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color:#111827;
      background:#ffffff;
      margin:0;
    }

    /* Loading bar */
    #loader {
      position: fixed;
      top: 0; left: 0;
      height: 3px;
      width: 0;
      background: linear-gradient(90deg, var(--accent), #22c55e);
      box-shadow: 0 0 6px rgba(79,70,229,.5);
      z-index: 9999;
      transition: width .35s ease, opacity .25s ease;
      opacity: 0;
    }
    #loader.active { opacity: 1; }

    /* Layout with vertical divider */
    .app{
      display:grid;
      grid-template-columns: var(--panel-w) 1fr;
      height:100vh;
    }
    .left{
      border-right:1px solid var(--border);
      padding:14px 14px 18px 16px;
      overflow-y:auto;        /* vertical scroll only */
      overflow-x:hidden;      /* no horizontal scroll */
      background:#fafafa;
    }
    .right{
      padding:10px;
      height:100%;
    }
    #container{
      height:100%;
      width:100%;
      border-left:1px solid var(--border);
    }

    /* Controls */
    .label{
      font-size:12px;
      color:var(--muted);
      letter-spacing:.02em;
      margin-bottom:6px;
      text-transform:uppercase;
    }
    .select2-container{ width:100%!important; }
    .hint{ font-size:12px; color:var(--muted); margin-top:6px; }

    /* Tables */
    table{ width:100%; border-collapse:collapse; margin-top:10px; background:#fff; }
    th, td{ border:1px solid var(--border); padding:8px 10px; text-align:left; vertical-align:top; }
    th{ background:#f6f7f9; font-weight:600; color:#111827; }
    td span.badge{
      padding:2px 6px; border-radius:6px; background:#eef2ff; font-size:12px; color:#3730a3;
      display:inline-block; white-space:nowrap;
    }
    .chip{
      display:inline-block; padding:2px 8px; border:1px solid #d5d7dd; border-radius:9999px;
      font-size:12px; color:#374151; background:#fff; margin:2px 6px 2px 0;
    }

    input[type="range"]{ width:100%; }

    /* Mobile */
    @media (max-width: 1024px){
      .app{ grid-template-columns: 1fr; }
      .right{ display:none; } /* hide graph on small screens */
    }
  </style>
</head>
<body>
  <!-- loader bar -->
  <div id="loader"></div>

  <main class="app">
    <aside class="left">
      <div class="label">Components</div>
      <select id="mySelect2" class="js-example-basic-multiple" multiple="multiple"></select>
      <div class="hint">Choose from the dropdown, or click a node in the graph to inspect details.</div>

      <table id="ecoTableId">
        <tr>
          <th style="width:160px">Ecosystem</th>
          <th colspan="2" id="ecoTitleTableId"></th>
        </tr>
        <tr>
          <td>Maintenance Cost</td>
          <td style="width:120px"><span id="maintenanceEquationId">&sum; (attribute × impact)</span></td>
          <td style="width:120px"><span id="maintenanceCostId">0</span></td>
        </tr>
        <tr>
          <td>Unique Component Types</td>
          <td colspan="2" id="typesListId"></td>
        </tr>
        <tr>
          <th>Attribute</th>
          <th>Impact</th>
          <th>Count</th>
        </tr>
      </table>

      <table id="ecoComponentTableId">
        <tr>
          <th>Component</th>
          <th id="componentTitleTableId">Click a node</th>
        </tr>
        <tr>
          <th style="width:160px">Attribute</th>
          <th>Count</th>
        </tr>
        <tr>
          <td>Cost Component</td>
          <td><span id="costComponentId">0</span></td>
        </tr>
        <tr>
          <td>Cost Latest Version</td>
          <td><span id="costComponentVersionId">0</span></td>
        </tr>
      </table>
    </aside>

    <section class="right">
      <div id="container"></div>
    </section>
  </main>

  <script>
    // -------------------- constants / helpers --------------------
    const URL_API_ENDPOINT = "https://releasetrain.io/api";
    const URL_HOMEPAGE     = "https://releasetrain.io";

    const params   = new URLSearchParams(window.location.search);
    const qParam   = params.get("q") || "";                 // user-selected components (comma-separated)
    const todayStr = yyyymmdd(new Date());                  // for default selection

    const versionChannel = { major:"major", minor:"minor", patch:"patch", cve:"cve", invalid:"invalid" };
    const table = document.getElementById("ecoTableId");
    let eco = null;

    // tags that are always ignored
    const STATIC_TAG_BLOCKLIST = new Set([
      "release","releases","version","versions","update","updates","latest","stable",
      "download","downloads","changelog","general","misc",
      "github","git","source","sources","binary","binaries","package","packages","install","installer",
      "windows","linux","mac","macos","os","x64","x86","amd64","arm64",
      "tool","tools","framework","app","application"
    ]);

    function yyyymmdd(d){
      const y = d.getUTCFullYear();
      const m = String(d.getUTCMonth()+1).padStart(2,"0");
      const day = String(d.getUTCDate()).padStart(2,"0");
      return `${y}${m}${day}`;
    }
    function isAlphaStart(s){ return /^[A-Za-z]/.test(String(s||"").charAt(0)); }
    function uniq(arr){ return Array.from(new Set(arr)); }
    function cap(s){ return String(s).charAt(0).toUpperCase() + String(s).slice(1); }

    // -------------------- loader bar --------------------
    const loader = document.getElementById("loader");
    function loaderStart(){
      loader.classList.add("active");
      loader.style.width = "0";
      requestAnimationFrame(()=>{ loader.style.width = "70%"; });
    }
    function loaderFinish(){
      loader.style.width = "100%";
      setTimeout(()=>{ loader.classList.remove("active"); loader.style.opacity = "0"; }, 250);
      setTimeout(()=>{ loader.style.width = "0"; loader.style.opacity = "1"; }, 400);
    }

    // -------------------- select2 init --------------------
    $("#mySelect2").select2({
      placeholder:"Filter components…",
      ajax:{
        url:`${URL_API_ENDPOINT}/c/names`,
        delay:150,
        processResults: data => {
          const list = Array.isArray(data) ? data : [];
          return { results: list.filter(isAlphaStart).map(x=>({id:x, text:x})) };
        }
      },
      multiple:true
    });

    // Build URL with comma-separated values (commas unencoded)
    $("#mySelect2").on("change", function(){
      const selected = $(this).find(":selected").map(function(){ return $(this).text(); }).get();
      const qStr = selected.map(v => encodeURIComponent(v)).join(","); // encode parts, keep commas
      window.location.href = `${URL_HOMEPAGE}/graph?q=${qStr}`;
    });

    // -------------------- boot --------------------
    document.getElementById("ecoTitleTableId").textContent = qParam ? decodeURIComponent(qParam) : `Updates from ${todayStr}`;
    extractData();

    // -------------------- data fetch --------------------
    function extractData(){
      loaderStart();
      $.ajax({
        url: `${URL_API_ENDPOINT}/v?q=${qParam}`,
        method: "GET",
        dataType: "json",
        success: (payload)=>{
          let items = [];
          if (payload && Array.isArray(payload.versions)) items = payload.versions;
          else if (Array.isArray(payload)) items = payload;

          // Sort by ascending release date
          items.sort((a,b)=> (Number(a.versionReleaseDate)||0) - (Number(b.versionReleaseDate)||0));

          // Default to today's components when q missing
          if (!qParam) {
            const todays = items.filter(v => String(v.versionReleaseDate) === todayStr);
            const todaysNames = uniq(todays.map(v => v.versionProductName).filter(Boolean));

            // Preselect in input
            $("#mySelect2").val(null).trigger("change");
            todaysNames.forEach(name=>{
              const opt = new Option(name, name, true, true);
              $("#mySelect2").append(opt).trigger("change.select2");
            });

            if (todays.length) transform(todays);
            else {
              const last50 = items.slice(-50);
              document.getElementById("ecoTitleTableId").textContent = "Last 50 updates";
              transform(last50);
            }
          } else {
            transform(items);
          }
        },
        error: (xhr, status, err)=> console.error("API error /api/v", status, err),
        complete: loaderFinish
      });
    }

    // -------------------- transform + render --------------------
    function transform(data){
      transformEcosystemInitialize(data);
      transformEcosystemUpdate();
      loadEcosystem();
    }

    function transformEcosystemInitialize(data){
      if (eco !== null) return;

      eco = { components:{}, edges:{}, attributeArrayList:["component","link","version","major","minor","patch","cve","invalid","today"], tagStats:{}, popularTags:new Set() };

      // discover extra (unique) component types
      data.forEach(v=>{
        if (v.versionPredictedComponentType) {
          const k = String(v.versionPredictedComponentType).toLowerCase();
          if (!eco.attributeArrayList.includes(k)) eco.attributeArrayList.push(k);
        }
      });

      // attribute rows (sliders)
      eco.attributeObjectList = {};
      eco.attributeArrayList.forEach(attr=>{
        eco.attributeObjectList[attr] = { factor: defaultFactor(attr), factorHtmlElementId: `factor${cap(attr)}Id`, count: 0 };
        table.appendChild(createSliderRow(attr));
      });

      // seed components and counts; also accumulate tag stats
      data.forEach(v=>{
        if (!validVersion(v)) { eco.attributeObjectList.invalid.count++; return; }

        const ch = channelOf(v);
        const name = v.versionProductName;

        if (!eco.components[name]) {
          eco.components[name] = newComponent(v);
          eco.components[name].attributeObjectList = {};
          eco.attributeArrayList.forEach(a=> eco.components[name].attributeObjectList[a] = { count:0 });
        }

        eco.components[name].attributeObjectList[ch].count++;
        eco.components[name].attributeObjectList.version.count++;
        eco.components[name].attributeObjectList.component.count = 1;

        if (!eco.components[name].tags) eco.components[name].tags = new Set();
        (v.versionSearchTags || []).forEach(t => {
          const tag = String(t).trim().toLowerCase();
          eco.components[name].tags.add(tag);
        });

        if (v.versionPredictedComponentType){
          const key = String(v.versionPredictedComponentType).toLowerCase();
          eco.components[name].versionPredictedComponentType = key;
          eco.components[name].attributeObjectList[key].count = 1;
        }

        eco.attributeObjectList[ch].count += 1;
        eco.attributeObjectList.version.count += 1;
        eco.attributeObjectList.component.count = Object.keys(eco.components).length;

        if (String(v.versionReleaseDate) === todayStr) {
          eco.attributeObjectList.today.count += 1;
          eco.components[name].attributeObjectList.today.count += 1;
        }
      });

      // build global tag frequency map (by component presence, not by total appearances)
      const compNames = Object.keys(eco.components);
      compNames.forEach(name=>{
        eco.components[name].tags.forEach(tag=>{
          eco.tagStats[tag] = (eco.tagStats[tag] || 0) + 1;
        });
      });

      // compute popularity threshold: ≥ 12% of components or at least 3 components
      const minPopularCount = Math.max(3, Math.round(0.12 * compNames.length));
      Object.entries(eco.tagStats).forEach(([tag,count])=>{
        if (count >= minPopularCount) eco.popularTags.add(tag);
      });

      // edges by tag overlap (thickness scales with number of shared *useful* tags)
      for (const A of compNames) {
        for (const B of compNames) {
          if (A===B) continue;
          const inter = intersectUsefulTags(A,B);
          if (inter.length) addEdge(A,B,inter.length);
        }
      }
    }

    function transformEcosystemUpdate(){
      eco.cost = 0;
      const relevant = ["major","minor","patch","cve","today"];

      for (const c in eco.components){
        eco.components[c].cost = 0;
        eco.components[c].costLatestVersion = 0;
      }

      eco.attributeArrayList.forEach(attr=>{
        const factor = Number(document.getElementById(eco.attributeObjectList[attr].factorHtmlElementId).value);
        eco.attributeObjectList[attr].factor = factor;

        eco.cost += eco.attributeObjectList[attr].count * factor;

        for (const c in eco.components){
          const cnt = eco.components[c].attributeObjectList[attr].count;
          eco.components[c].cost += cnt * factor;
          if (relevant.includes(attr)){ eco.components[c].costLatestVersion += (cnt>0 ? 1 : 0) * factor; }
        }
      });
    }

    function loadEcosystem(){
      renderGraph();
      renderEcoTable();
      renderComponentTable(); // default zeros
    }

    // -------------------- graph --------------------
    function renderGraph(){
      const graph = { nodes:[], edges:[] };
      document.getElementById("container").innerHTML = "";

      // compute max cost first
      let i=0, maxVal=0;
      for (const name in eco.components) {
        if (eco.components[name].cost > maxVal) maxVal = eco.components[name].cost;
      }

      for (const name in eco.components){
        const n = eco.components[name];
        n.t = 3*Math.PI*i/100;
        n.x = Math.round(30*Math.cos(n.t));
        n.y = Math.round(30*Math.sin(n.t));
        n.size = 1;
        n.label = `${name} • cost ${n.cost}`;

        // grayscale based on cost (0 -> #eee, max -> ~#3a3a3a)
        n.color = nodeColorScaled(n.cost, maxVal);
        graph.nodes.push(n);
        i += 4;
      }

      for (const e in eco.edges) graph.edges.push(eco.edges[e]);

      const s = new sigma({
        graph,
        renderer: { container: document.getElementById("container"), type: sigma.renderers.canvas },
        settings: {
          drawEdgeLabels: false,         // removed labels
          drawLabels: true,
          batchEdgesDrawing:true,
          labelThreshold: 0,
          defaultEdgeColor: "#c7cbd4",
          edgeColor: "default"
        }
      });

      // color the max as red
      let winner = null, winnerCost = -1;
      graph.nodes.forEach(n => { if (n.cost > winnerCost){ winnerCost = n.cost; winner = n; }});
      if (winner) winner.color = "rgb(255, 80, 80)";

      s.refresh();

      s.bind("clickNode", (e)=>{
        const comp = e.data.node.label.split(" • ")[0];
        renderComponentTable(comp);
      });
    }

    function nodeColorScaled(cost, maxCost){
      if (!maxCost || cost <= 0) return "rgb(238,238,238)";           // very light gray when 0
      const v = Math.round(230 - (170 * (cost / maxCost)));           // 230 → 60
      return `rgb(${v},${v},${v})`;
    }

    // -------------------- tables --------------------
    function renderEcoTable(){
      // unique component types (discovered attributes minus base)
      const base = new Set(["component","link","version","major","minor","patch","cve","invalid","today"]);
      const types = eco.attributeArrayList.filter(a => !base.has(a));
      const typesHtml = types.length ? types.map(t=>`<span class="chip">${t}</span>`).join("") : '<span class="chip">none</span>';
      document.getElementById("typesListId").innerHTML = typesHtml;

      eco.attributeArrayList.forEach(attr=>{
        const el = document.getElementById(`${attr}AllId`);
        if (el) el.innerHTML = ecoCountPretty(attr);
      });
      document.getElementById("maintenanceCostId").textContent = eco.cost;
    }

    function renderComponentTable(component){
      const t = document.getElementById("ecoComponentTableId");
      const keep = 4;
      while (t.rows.length > keep) t.deleteRow(keep);

      document.getElementById("costComponentId").textContent = "0";
      document.getElementById("costComponentVersionId").textContent = "0";

      if (!component || !eco.components[component]){
        document.getElementById("componentTitleTableId").textContent = "Click a node";
        return;
      }

      document.getElementById("componentTitleTableId").innerHTML =
        `<a href="${URL_HOMEPAGE}?q=${encodeURIComponent(component)}" target="_blank">${component}</a>`;

      eco.attributeArrayList.forEach(attr=>{
        const cnt = eco.components[component].attributeObjectList[attr].count;
        if (cnt>0){
          const row = t.insertRow();
          row.insertCell(0).innerText = attr;
          const cell = row.insertCell(1);
          const factor = eco.attributeObjectList[attr].factor;
          const total  = cnt * factor;
          cell.innerHTML = `<span class="badge">${cnt} × ${factor} = ${total}</span>`;
        }
      });

      document.getElementById("costComponentId").textContent = eco.components[component].cost;
      document.getElementById("costComponentVersionId").textContent = eco.components[component].costLatestVersion;
    }

    // -------------------- eco build helpers --------------------
    function ecoCountPretty(attr){
      const { count, factor } = eco.attributeObjectList[attr];
      return `<span class="badge">${count} × ${factor} = ${count*factor}</span>`;
    }
    function validVersion(v){
      if (!v || !v.versionNumber) return false;
      const p = String(v.versionNumber).split(".");
      if (isNaN(Number(p[0])) && v.versionReleaseChannel !== "patch") return false;
      return true;
    }
    function channelOf(v){
      const p = String(v.versionNumber||"").split(".").map(n=>Number(n)||0);
      if (v.versionReleaseChannel==="cve") return "cve";
      if (v.versionReleaseChannel==="patch" || p[2]>0) return "patch";
      if (p[1]>0 && p[2]===0) return "minor";
      if (p[1]===0 && p[2]===0) return "major";
      return "invalid";
    }
    function newComponent(v){
      return { id:v.versionProductName, label:v.versionProductName, color:"black", x:0,y:0,size:1, cost:0, costLatestVersion:0, tags:new Set() };
    }

    // tag utility checks
    function isUsefulTag(tag){
      if (!tag || typeof tag !== "string") return false;
      if (STATIC_TAG_BLOCKLIST.has(tag)) return false;      // remove known generic tags
      if (eco.popularTags.has(tag)) return false;           // remove globally common tags
      if (tag.length < 3) return false;                     // ignore very short tokens
      return true;
    }

    // intersect by *useful* tags only (no date influence)
    function intersectUsefulTags(a,b){
      return Array.from(eco.components[a].tags).filter(t => {
        return isUsefulTag(t) && eco.components[b].tags.has(t);
      });
    }

    // Edge creation with thickness = f(sharedTags)
    function edgeSizeFor(count){
      // map 1..N to ~0.8..6 (cap)
      return Math.min(6, 0.8 + count * 1.2);
    }
    function addEdge(a,b,sharedCount){
      const id = a+b;
      if (!eco.edges[id]){
        eco.edges[id] = {
          id,
          source:a,
          target:b,
          size: edgeSizeFor(sharedCount),   // thickness
          color: "#c7cbd4"                  // subtle gray
        };
        eco.attributeObjectList.link.count++;
        eco.components[a].attributeObjectList.link.count++;
      }
    }

    function createSliderRow(attr){
      const row = document.createElement('tr');
      row.id = `${attr}RowId`;
      row.innerHTML = `
        <td>${cap(attr)}</td>
        <td><input id="factor${cap(attr)}Id" type="range" min="0" max="2" value="${defaultFactor(attr)}" oninput="onImpactChange()"></td>
        <td><span id="${attr}AllId"><span class="badge">0 × ${defaultFactor(attr)} = 0</span></span></td>`;
      return row;
    }
    function defaultFactor(attr){
      if (["link","major","minor","patch","cve","invalid","version"].includes(attr)) return 0;
      if (attr==="today") return 2;
      return 1;
    }
    window.onImpactChange = function(){ transformEcosystemUpdate(); renderEcoTable(); renderGraph(); };
  </script>
</body>
</html>
