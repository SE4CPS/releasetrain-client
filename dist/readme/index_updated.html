<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Request and Display</title>
    <link href="https://releasetrain.io/img/favicon.ico" rel="icon" type="image/x-icon" />
</head>

<body>
<script>
// =========================
// NEW: Fetch subreddits
// =========================
function fetchSubreddits() {
    const url = 'https://releasetrain.io/api/reddit/meta/subreddits';

    fetch(url)
        .then(response => response.json())
        .then(data => {
            if (!data || !data.data || !Array.isArray(data.data)) {
                console.error('Invalid subreddit data:', data);
                return;
            }

            const subreddits = data.data;
            console.log('Available subreddits:', subreddits);

            window.availableSubreddits = subreddits;
        })
        .catch(error => {
            console.error('Error fetching subreddits:', error);
        });
}

// INIT
fetchSubreddits();
</script>
</body>
</html>
