<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>releasetrain.io — Updates Feed (Filters + Lazy)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Software component version releases feed" />

  <style>
    :root{
      --bg:#0f1115; --panel:#171a21; --muted:#9aa3af; --text:#e5e7eb; --brand:#60a5fa; --line:#2a2f3a;
      --chip:#1f2430; --chipText:#e5e7eb; --focus:#a5b4fc; --bad:#ef4444; --warn:#f59e0b; --ok:#22c55e;
      --reddit:#ff4500; --link:#93c5fd; --shadow:0 6px 20px rgba(0,0,0,.25);
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#f7f7fb; --panel:#ffffff; --muted:#6b7280; --text:#0f172a; --brand:#2563eb; --line:#e5e7eb;
        --chip:#eef2ff; --chipText:#1f2937; --focus:#4f46e5; --bad:#dc2626; --warn:#d97706; --ok:#16a34a;
        --reddit:#ff4500; --link:#1d4ed8; --shadow:0 6px 20px rgba(0,0,0,.08);
      }
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

    .topbar{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .brand{font-weight:700;letter-spacing:.2px}
    .brand b{color:var(--brand)}
    .spacer{flex:1 1 auto}

    .kpis{display:flex;gap:8px;flex-wrap:wrap}
    .kpi{background:var(--chip);color:var(--chipText);border:1px solid var(--line);padding:6px 10px;border-radius:999px;font-size:12px}
    .kpi em{font-style:normal;color:var(--brand);font-weight:700}

    .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .field{display:flex;align-items:center;gap:6px}
    .field label{font-size:12px;color:var(--muted)}
    input[type="text"],button{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
    input[type="text"]{min-width:220px}
    input[type="text"]:focus,button:focus{outline:2px solid var(--focus);outline-offset:2px}
    button{background:var(--brand);color:#fff;border-color:transparent;cursor:pointer;font-weight:600}
    button.secondary{background:transparent;color:var(--text);border-color:var(--line)}

    .toggles{display:flex;gap:6px;flex-wrap:wrap}
    .toggle{background:var(--chip);border:1px solid var(--line);color:var(--chipText);padding:6px 10px;border-radius:999px;cursor:pointer;font-weight:600;font-size:12px;user-select:none}
    .toggle[aria-pressed="true"]{background:var(--brand);border-color:transparent;color:#fff}
    .toggle:focus{outline:2px solid var(--focus);outline-offset:2px}

    main{max-width:1100px;margin:0 auto;padding:12px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
    .panel header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
    .status{color:var(--muted);font-size:12px}

    .feedGroup{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
    summary{cursor:pointer;padding:10px 12px;list-style:none;user-select:none;font-weight:700;background:var(--chip)}
    summary::-webkit-details-marker{display:none}
    summary .meta{font-weight:400;color:var(--muted)}
    .updates{padding:8px 10px}

    .item{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
    .item:last-child{border-bottom:none}
    .avatar{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);object-fit:cover}
    .titleRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .titleRow a{color:var(--link);text-decoration:none;font-weight:700}
    .titleRow a:hover{text-decoration:underline}
    .meta{color:var(--muted);font-size:12px}

    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .chip{background:var(--chip);color:var(--chipText);border:1px solid var(--line);font-size:11px;padding:2px 6px;border-radius:999px;white-space:nowrap}
    .chip.bad{background:rgba(239,68,68,.12);color:var(--bad);border-color:rgba(239,68,68,.35)}
    .chip.warn{background:rgba(245,158,11,.12);color:var(--warn);border-color:rgba(245,158,11,.35)}
    .chip.ok{background:rgba(34,197,94,.12);color:var(--ok);border-color:rgba(34,197,94,.35)}
    .chip.link a{color:inherit;text-decoration:none}

    .desc{margin-top:6px;color:var(--text);opacity:.9}
    .desc a{color:var(--link)}

    .redditWrap{margin-top:8px;padding:8px;border:1px dashed var(--line);border-radius:8px;background:transparent}
    .redditHead{font-weight:700;color:var(--reddit);display:flex;gap:8px;align-items:center;margin-bottom:6px}
    .redditList{display:flex;flex-direction:column;gap:6px}
    .redditItem a{color:var(--text);text-decoration:none}
    .redditItem a:hover{text-decoration:underline}
    .redditMeta{font-size:12px;color:var(--muted)}

    .skeleton{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.08), rgba(255,255,255,0.04));background-size:200% 100%;animation:shimmer 1.2s infinite}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .sentinel{height:60px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
    .sr-only{position:absolute !important;width:1px;height:1px;margin:-1px;border:0;padding:0;clip:rect(0 0 0 0);overflow:hidden}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Releasetrain <b>v3.1.0</b></div>

    <div class="kpis" role="status" aria-live="polite">
      <div class="kpi">Page Versions: <em id="kpi-page">0</em></div>
      <div class="kpi" id="kpi-range">Date Range: <em>—</em></div>
    </div>

    <div class="spacer" aria-hidden="true"></div>

    <!-- Filters -->
    <form id="filterForm" class="controls" aria-label="Filters">
      <div class="field">
        <label for="components">Components</label>
        <input id="components" name="components" type="text" placeholder="linux, android, nginx" />
      </div>
      <div class="field">
        <label for="subs">Subreddits</label>
        <input id="subs" name="subs" type="text" placeholder="linux, python, chrome" />
      </div>
      <button type="submit">Apply</button>
      <button type="button" id="clearBtn" class="secondary">Clear</button>
    </form>

    <!-- OR-logic toggles -->
    <div class="toggles" role="group" aria-label="Quick filters (OR)">
      <button class="toggle" data-key="major" aria-pressed="false" type="button">Major</button>
      <button class="toggle" data-key="minor" aria-pressed="false" type="button">Minor</button>
      <button class="toggle" data-key="patch" aria-pressed="false" type="button">Patch</button>
      <button class="toggle" data-key="os" aria-pressed="false" type="button">OS</button>
      <button class="toggle" data-key="server" aria-pressed="false" type="button">Server</button>
      <button class="toggle" data-key="browser" aria-pressed="false" type="button">Browser</button>
      <button class="toggle" data-key="cve" aria-pressed="false" type="button">CVE</button>
      <button class="toggle" data-key="reddit" aria-pressed="false" type="button">Reddit</button>
    </div>
  </div>

  <main>
    <section class="panel" aria-label="Updates Feed">
      <header>
        <h2 style="margin:0;font-size:16px">Recent Updates</h2>
        <div id="status" class="status">Idle</div>
      </header>

      <div id="feed">
        <div class="skeleton" aria-hidden="true" style="height:80px"></div>
        <div class="skeleton" aria-hidden="true" style="height:80px"></div>
        <div class="skeleton" aria-hidden="true" style="height:80px"></div>
      </div>

      <div id="sentinel" class="sentinel" role="status" aria-live="polite">Loading more…</div>
    </section>
  </main>

  <script>
    // ---------- Constants ----------
    const API_BASE = "https://releasetrain.io/api/";
    const GROUPS_BATCH = 6;
    const REDDIT_LIMIT = 200;
    const MAX_VER_DESC = 260;

    // ---------- Utilities ----------
    const $ = s => document.querySelector(s);
    const $$ = s => Array.from(document.querySelectorAll(s));
    const safe = (v,d="") => v==null?d:v;
    const uniq = a => Array.from(new Set(a));
    const norm = s => String(s||"").toLowerCase().trim();
    const tokens = s => uniq(String(s||"").split(",").map(t=>norm(t)).filter(Boolean));

    const fmtDateToken = (yyyymmdd) => {
      if(!/^\d{8}$/.test(yyyymmdd)) return yyyymmdd || "Unknown";
      const y=+yyyymmdd.slice(0,4), m=+yyyymmdd.slice(4,6)-1, d=+yyyymmdd.slice(6,8);
      const dt = new Date(y,m,d);
      const today = new Date(), yest = new Date(); yest.setDate(today.getDate()-1);
      if(dt.toDateString()===today.toDateString()) return "Today";
      if(dt.toDateString()===yest.toDateString()) return "Yesterday";
      return dt.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"});
    };
    const shortTime = (iso)=> { try{ return new Date(iso).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});}catch{return "";} };
    const truncate = (str, n=MAX_VER_DESC)=> (str && str.length>n) ? (str.slice(0,n-1)+"…") : (str||"");
    const avatarFor = (item) => {
      const url = (item.versionUrl||"")+"";
      if(url.includes("github.com/")){ const user = url.split("/")[3]; if(user) return `https://github.com/${user}.png`; }
      if(url.startsWith("https://nvd.nist.gov/")) return "./img/cve.png";
      return "./img/default.png";
    };

    // ---------- API ----------
    const Api = {
      async versions(componentCsv){
        const q = componentCsv ? `?q=${encodeURIComponent(componentCsv)}` : "";
        const url = `${API_BASE}v/${q}`;
        const res = await fetch(url, {headers:{Accept:"application/json"}});
        if(!res.ok) throw new Error(`${res.status} ${res.statusText} @ ${url}`);
        const json = await res.json();
        return json.versions || [];
      },
      async reddit(){
        const url = `${API_BASE}reddit?isUpdateRelated=false&showCount=true&limit=${REDDIT_LIMIT}`;
        const res = await fetch(url, {headers:{Accept:"application/json"}});
        if(!res.ok) throw new Error(`${res.status} ${res.statusText} @ ${url}`);
        const json = await res.json();
        return Array.isArray(json) ? json : (json.data || []);
      }
    };

    // ---------- State ----------
    const STATE = {
      rawVersions: [],
      redditAll: [],
      redditBySub: new Map(), // norm(sub) => posts[]
      groupsFiltered: [],
      groupIndex: 0,
      observer: null,
      loading:false,
      filters:{
        components: [],   // array of component tokens
        subs: [],         // array of subreddit tokens
        toggles: new Set()// 'major','minor','patch','os','server','browser','cve','reddit'
      }
    };

    // ---------- Reddit index & matching ----------
    function buildRedditIndex(list){
      STATE.redditBySub = new Map();
      for(const p of list){
        const key = norm(p.subreddit);
        if(!key) continue;
        if(!STATE.redditBySub.has(key)) STATE.redditBySub.set(key, []);
        STATE.redditBySub.get(key).push(p);
      }
      for(const arr of STATE.redditBySub.values()){
        arr.sort((a,b)=>{
          const da = +new Date(a.created_utc||0), db = +new Date(b.created_utc||0);
          if(db!==da) return db-da;
          return (b.score||0)-(a.score||0);
        });
      }
    }

    function redditMatchesForVersion(v, limit=6){
      // Keys to try: product name, brand, tags, classification types
      const keysRaw = uniq([
        safe(v.versionProductName,""),
        safe(v.versionProductBrand,""),
        ...(Array.isArray(v.versionSearchTags)?v.versionSearchTags:[]),
        ...(v.classification && Array.isArray(v.classification.componentType)?v.classification.componentType:[])
      ]).filter(Boolean);

      const keys = keysRaw.map(norm).filter(k=>k.length>=3);
      let pool = [];
      const seen = new Set();

      // subreddit exact matches
      for(const k of keys){
        const arr = STATE.redditBySub.get(k);
        if(arr){
          for(const p of arr){
            if(seen.has(p.redditId)) continue;
            pool.push(p); seen.add(p.redditId);
            if(pool.length>=limit) return pool;
          }
        }
      }

      // title contains any keyword
      for(const p of STATE.redditAll){
        if(seen.has(p.redditId)) continue;
        const title = (p.title||"").toLowerCase();
        if(keys.some(k=>title.includes(k))){
          pool.push(p); seen.add(p.redditId);
          if(pool.length>=limit) return pool;
        }
      }
      return pool;
    }

    // ---------- Grouping ----------
    function groupByDate(list){
      const map = new Map();
      for(const v of list){
        const d = String(safe(v.versionReleaseDate,"")).slice(0,8);
        if(!d) continue;
        const k = fmtDateToken(d);
        if(!map.has(k)) map.set(k, []);
        map.get(k).push(v);
      }
      const ordered = Array.from(map.keys()).sort((a,b)=>{
        if(a==="Today") return -1; if(b==="Today") return 1;
        if(a==="Yesterday") return -1; if(b==="Yesterday") return 1;
        return new Date(b)-new Date(a);
      });
      return ordered.map(k=>{
        const items = map.get(k).slice().sort((a,b)=>{
          const da = +new Date(a.versionTimestampLastUpdate || a.versionTimestamp || 0);
          const db = +new Date(b.versionTimestampLastUpdate || b.versionTimestamp || 0);
          return db - da;
        });
        return {date:k, items};
      });
    }

    // ---------- Filtering ----------
    function matchesToggles(v, redditCount){
      const set = STATE.filters.toggles;
      if(set.size===0) return true; // no toggle restriction

      const channel = norm(v.versionReleaseChannel);
      const compTypes = (v.classification && Array.isArray(v.classification.componentType) ? v.classification.componentType.map(norm) : []);
      const isCve = !!v.isCve;

      const tests = {
        major: channel==="major",
        minor: channel==="minor",
        patch: channel==="patch",
        os: compTypes.includes("os"),
        server: compTypes.includes("server"),
        browser: compTypes.includes("browser"),
        cve: isCve,
        reddit: redditCount>0
      };

      // OR logic: if any selected key is true -> pass
      for(const key of set){
        if(tests[key]) return true;
      }
      return false;
    }

    function applyFilters(){
      // component tokens (server-side already applied if user entered them before fetch,
      // but we also apply client-side to be safe)
      const compTokens = STATE.filters.components;
      const subTokens = STATE.filters.subs;

      let list = STATE.rawVersions.filter(v=>{
        // component filter (OR among tokens)
        if(compTokens.length){
          const name = norm(v.versionProductName);
          const brand = norm(v.versionProductBrand);
          const tagStr = (Array.isArray(v.versionSearchTags)?v.versionSearchTags.join(","):"").toLowerCase();
          const hit = compTokens.some(t => name.includes(t) || brand.includes(t) || tagStr.includes(t));
          if(!hit) return false;
        }

        // reddit matches + subreddit filter
        const matches = redditMatchesForVersion(v);
        const hasReddit = matches.length>0;

        if(subTokens.length){
          const hitSub = matches.some(p => subTokens.includes(norm(p.subreddit)));
          if(!hitSub) return false;
        }

        // toggles OR logic
        return matchesToggles(v, hasReddit?matches.length:0);
      });

      // regroup and reset lazy state
      STATE.groupsFiltered = groupByDate(list);
      STATE.groupIndex = 0;

      // KPIs
      $("#kpi-page").textContent = list.length;
      if(list.length){
        const dates = list.map(v=>v.versionReleaseDate).filter(Boolean).sort();
        $("#kpi-range").innerHTML = `Date Range: <em>${fmtDateToken(dates[0])} – ${fmtDateToken(dates[dates.length-1])}</em>`;
      } else {
        $("#kpi-range").innerHTML = `Date Range: <em>—</em>`;
      }

      // clear feed and render first batch
      $("#feed").innerHTML = "";
      $("#sentinel").textContent = STATE.groupsFiltered.length ? "Loading more…" : "No results";
      appendNextGroups();
    }

    // ---------- Rendering ----------
    function chip(text, kind){
      const cls = kind==='bad'?'chip bad':kind==='warn'?'chip warn':kind==='ok'?'chip ok':'chip';
      return `<span class="${cls}">${text}</span>`;
    }

    function renderRedditBlock(matches){
      if(!matches || !matches.length) return "";
      const items = matches.slice(0,3).map(p=>{
        const when = p.created_utc ? new Date(p.created_utc).toLocaleString() : "";
        return `
          <div class="redditItem">
            <a href="${p.url}" target="_blank" rel="noopener">${p.title}</a>
            <div class="redditMeta">r/${p.subreddit} • ▲ ${p.score||0} • 💬 ${p.num_comments||0} • ${when}</div>
          </div>`;
      }).join("");
      return `
        <div class="redditWrap" role="region" aria-label="Related Reddit discussions">
          <div class="redditHead">Reddit matches</div>
          <div class="redditList">${items}</div>
        </div>`;
    }

    function renderGroupNode(group){
      const det = document.createElement("details");
      det.className = "feedGroup";
      det.open = document.querySelectorAll(".feedGroup").length===0;

      const sum = document.createElement("summary");
      sum.innerHTML = `${group.date} <span class="meta">(${group.items.length} updates)</span>`;
      det.appendChild(sum);

      const wrap = document.createElement("div");
      wrap.className = "updates";

      group.items.forEach(it=>{
        const row = document.createElement("article");
        row.className = "item";

        const img = document.createElement("img");
        img.className = "avatar";
        img.alt = (safe(it.versionProductName,"")).slice(0,40);
        img.src = avatarFor(it);
        row.appendChild(img);

        const body = document.createElement("div");
        const title = document.createElement("div");
        title.className = "titleRow";

        const bestUrl = (it.versionUrl && it.versionUrl.startsWith("http")) ? it.versionUrl
                      : (it.versionReleaseNotes && it.versionReleaseNotes.startsWith("http")) ? it.versionReleaseNotes
                      : "#";
        const link = document.createElement("a");
        link.href = bestUrl; link.target="_blank"; link.rel="noopener";
        link.textContent = `${safe(it.versionProductName,"")}${it.versionNumber?(" "+it.versionNumber):""}`;
        title.appendChild(link);

        const ts = safe(it.versionTimestampLastUpdate,"");
        if(ts){
          const t = document.createElement("span");
          t.className = "meta";
          t.textContent = `(${shortTime(ts)})`;
          title.appendChild(t);
        }
        body.appendChild(title);

        // chips
        const chips = document.createElement("div");
        chips.className = "chips";
        const ch = (safe(it.versionReleaseChannel,"other")+"").toLowerCase();
        const color = ch==="major"?"ok":ch==="patch"?"warn":ch==="minor"?"":"bad";
        chips.insertAdjacentHTML("beforeend", chip(ch || "other", color));
        if(it.isCve) chips.insertAdjacentHTML("beforeend", chip("cve","bad"));
        if(it.versionProductBrand) chips.insertAdjacentHTML("beforeend", chip(String(it.versionProductBrand).toLowerCase(),""));
        if(it.versionId || it._id) chips.insertAdjacentHTML("beforeend", `<span class="chip link"><a href="https://releasetrain.io/api/v/${it._id}" target="_blank" rel="noopener">id:${String(it._id||"").slice(-8)}</a></span>`);
        const compTypes = (it.classification && Array.isArray(it.classification.componentType) ? it.classification.componentType : []);
        compTypes.filter(v=>v && v!=="UNKNOWN").forEach(v=>chips.insertAdjacentHTML("beforeend", chip(String(v).toLowerCase(),"")));
        const secTypes = (it.classification && Array.isArray(it.classification.securityType) ? it.classification.securityType : []);
        secTypes.filter(v=>v && v!=="UNKNOWN").forEach(v=>chips.insertAdjacentHTML("beforeend", chip(String(v).toLowerCase(),"bad")));
        const brkTypes = (it.classification && Array.isArray(it.classification.breakingType) ? it.classification.breakingType : []);
        brkTypes.filter(v=>v && v!=="UNKNOWN").forEach(v=>chips.insertAdjacentHTML("beforeend", chip(String(v).toLowerCase(),"warn")));
        if(Array.isArray(it.versionSearchTags) && it.versionSearchTags.length){
          it.versionSearchTags.slice(0,6).forEach(t=>{
            chips.insertAdjacentHTML("beforeend", chip(String(t).toLowerCase(),""));
          });
        }
        body.appendChild(chips);

        // description
        const descText = truncate(safe(it.versionReleaseNotes,"")) || safe(it.versionReleaseComments,"");
        if(descText){
          const desc = document.createElement("div");
          desc.className = "desc";
          const more = (bestUrl && bestUrl!=="#") ? ` <a href="${bestUrl}" target="_blank" rel="noopener">read more ↗</a>` : "";
          desc.innerHTML = `${descText}${more}`;
          body.appendChild(desc);
        }

        // reddit block
        const matches = redditMatchesForVersion(it);
        const redditHTML = renderRedditBlock(matches);
        if(redditHTML) body.insertAdjacentHTML("beforeend", redditHTML);

        row.appendChild(body);
        wrap.appendChild(row);
      });

      det.appendChild(wrap);
      return det;
    }

    function appendNextGroups(){
      if(STATE.loading) return;
      if(STATE.groupIndex >= STATE.groupsFiltered.length){
        $("#sentinel").textContent = "End of results";
        return;
      }
      STATE.loading = true;

      const feed = $("#feed");
      const end = Math.min(STATE.groupIndex + GROUPS_BATCH, STATE.groupsFiltered.length);
      for(let i=STATE.groupIndex;i<end;i++){
        feed.appendChild(renderGroupNode(STATE.groupsFiltered[i]));
      }
      STATE.groupIndex = end;
      STATE.loading = false;
    }

    function resetFeed(){
      $("#feed").innerHTML = "";
      $("#sentinel").textContent = "Loading more…";
      STATE.groupIndex = 0;
    }

    function setupObserver(){
      if(STATE.observer) STATE.observer.disconnect();
      STATE.observer = new IntersectionObserver((entries)=>{
        const e = entries[0];
        if(e && e.isIntersecting) appendNextGroups();
      },{rootMargin:"400px 0px"});
      STATE.observer.observe($("#sentinel"));
    }

    // ---------- Boot + Wiring ----------
    async function boot(){
      $("#status").textContent = "Loading…";
      resetFeed();
      try{
        // initial tokens from URL
        const url = new URL(location.href);
        const compCsv = url.searchParams.get("q") || "";
        const subCsv  = url.searchParams.get("sub") || "";
        $("#components").value = compCsv;
        $("#subs").value = subCsv;

        STATE.filters.components = tokens(compCsv);
        STATE.filters.subs = tokens(subCsv);

        const [versions, reddit] = await Promise.all([
          Api.versions(compCsv),
          Api.reddit().catch(()=>[])
        ]);

        versions.sort((a,b)=>{
          if(a.versionReleaseDate !== b.versionReleaseDate){
            return String(b.versionReleaseDate).localeCompare(String(a.versionReleaseDate));
          }
          const da = +new Date(a.versionTimestampLastUpdate || a.versionTimestamp || 0);
          const db = +new Date(b.versionTimestampLastUpdate || b.versionTimestamp || 0);
          return db - da;
        });

        STATE.rawVersions = versions;
        STATE.redditAll = reddit;
        buildRedditIndex(reddit);

        applyFilters(); // builds groups & renders first batch
        $("#status").textContent = `Loaded ${versions.length} items`;
      }catch(err){
        console.error(err);
        $("#feed").innerHTML = `<div class="meta">Error: ${err.message}</div>`;
        $("#status").textContent = "Failed to load (check network/CORS)";
      }
    }

    // form submit
    $("#filterForm").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const compCsv = $("#components").value.trim().replace(/\s+/g,'');
      const subCsv  = $("#subs").value.trim().replace(/\s+/g,'');

      // update URL
      const u = new URL(location.href);
      if(compCsv) u.searchParams.set("q", compCsv); else u.searchParams.delete("q");
      if(subCsv)  u.searchParams.set("sub", subCsv); else u.searchParams.delete("sub");
      history.replaceState({}, "", u.toString());

      // fetch versions again if components changed (server-side filter)
      $("#status").textContent = "Filtering…";
      try{
        STATE.filters.components = tokens(compCsv);
        STATE.filters.subs = tokens(subCsv);

        const versions = await Api.versions(compCsv);
        versions.sort((a,b)=>{
          if(a.versionReleaseDate !== b.versionReleaseDate){
            return String(b.versionReleaseDate).localeCompare(String(a.versionReleaseDate));
          }
          const da = +new Date(a.versionTimestampLastUpdate || a.versionTimestamp || 0);
          const db = +new Date(b.versionTimestampLastUpdate || b.versionTimestamp || 0);
          return db - da;
        });
        STATE.rawVersions = versions;

        applyFilters();
        $("#status").textContent = `Filtered (${versions.length})`;
      }catch(err){
        console.error(err);
        $("#status").textContent = "Filter failed";
      }
    });

    // clear
    $("#clearBtn").addEventListener("click", ()=>{
      $("#components").value = "";
      $("#subs").value = "";
      STATE.filters.components = [];
      STATE.filters.subs = [];
      const u = new URL(location.href);
      u.searchParams.delete("q"); u.searchParams.delete("sub");
      history.replaceState({}, "", u.toString());
      // Re-fetch full feed
      boot();
    });

    // toggles (OR logic)
    $$(".toggle").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const key = btn.dataset.key;
        const pressed = btn.getAttribute("aria-pressed")==="true";
        btn.setAttribute("aria-pressed", pressed?"false":"true");
        if(pressed) STATE.filters.toggles.delete(key);
        else STATE.filters.toggles.add(key);
        applyFilters();
      });
    });

    // lazy observer
    setupObserver();
    boot();
  </script>
</body>
</html>
