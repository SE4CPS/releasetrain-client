<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>releasetrain.io — Component List (dates left, newest first)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Single list per component with leading tags, CVE highlight, strict subreddit matches, and left-side dates" />
  <style>
    :root{
      --bg:#0f1115;--panel:#171a21;--muted:#9aa3af;--text:#e5e7eb;--brand:#60a5fa;--line:#2a2f3a;--chip:#1f2430;--chipText:#e5e7eb;--focus:#a5b4fc;
      --bad:#ef4444;--warn:#f59e0b;--ok:#22c55e;--reddit:#ff4500;--link:#93c5fd;--shadow:0 6px 20px rgba(0,0,0,.25);
      --topbar-h:0px;--navloader-h:0px;--risk-bg:rgba(239,68,68,.08);--risk-border:rgba(239,68,68,.35)
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#f7f7fb;--panel:#ffffff;--muted:#6b7280;--text:#0f172a;--brand:#2563eb;--line:#e5e7eb;--chip:#eef2ff;--chipText:#1f2937;--focus:#4f46e5;
        --bad:#dc2626;--warn:#d97706;--ok:#16a34a;--reddit:#ff4500;--link:#1d4ed8;--shadow:0 6px 20px rgba(0,0,0,.08);
        --risk-bg:rgba(220,38,38,.06);--risk-border:rgba(220,38,38,.25)
      }
    }
    *{box-sizing:border-box}html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial}

    .topbar{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .brand{font-weight:700;letter-spacing:.2px}.brand b{color:var(--brand)}.spacer{flex:1 1 auto}
    .gh-link{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700}
    .gh-link:hover{background:var(--chip)}

    .navloader{position:fixed;top:var(--topbar-h);left:0;right:0;height:3px;background:transparent;overflow:hidden;z-index:999;display:none}
    .navloader.active{display:block}
    .navloader::after{content:"";display:block;width:40%;height:100%;background:linear-gradient(90deg,var(--brand),#9bbcfb,var(--brand));animation:slide 1s infinite}
    @keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}

    main{max-width:1100px;margin:0 auto;padding:calc(var(--topbar-h) + var(--navloader-h) + 12px) 12px 12px}

    .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .field{display:flex;align-items:center;gap:6px}.field label{font-size:12px;color:var(--muted)}
    input[type="text"],button{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
    input[type="text"]{min-width:240px}input[type="text"]:focus,button:focus{outline:2px solid var(--focus);outline-offset:2px}
    button{background:var(--brand);color:#fff;border-color:transparent;cursor:pointer;font-weight:600}
    button.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}

    .togglesWrap{width:100%;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
    .toggles{display:flex;gap:6px;flex-wrap:wrap}
    .toggle{background:var(--chip);border:1px solid var(--line);color:var(--chipText);padding:6px 10px;border-radius:999px;cursor:pointer;font-weight:700;font-size:12px}
    .toggle[aria-pressed="true"]{background:var(--brand);border-color:transparent;color:#fff}
    .toggle.disabled{opacity:.55;cursor:not-allowed}
    .toggle.redditRisk{border-color:var(--warn);color:var(--warn);background:rgba(245,158,11,.12);box-shadow:inset 0 0 0 1px var(--warn)}
    .toggle.redditRisk[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#111}

    .kpis{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
    .kpi{background:var(--chip);color:var(--chipText);border:1px solid var(--line);padding:6px 10px;border-radius:999px;font-size:12px}
    .kpi em{font-style:normal;color:var(--brand);font-weight:700}

    .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
    .panel header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
    .status{color:var(--muted);font-size:12px}

    .feedGroup{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
    summary{cursor:pointer;padding:10px 12px;list-style:none;user-select:none;font-weight:700;background:var(--chip)}
    summary::-webkit-details-marker{display:none}
    summary .meta{font-weight:400;color:var(--muted)}

    .updates{padding:8px 10px}
    .list{display:flex;flex-direction:column;gap:10px;margin:6px 0 2px}

    /* rows now have a DATE column on the left */
    .li{
      display:grid;
      grid-template-columns: 92px 26px 1fr; /* date | avatar | content */
      gap:10px;
      padding:10px 0;
      border-bottom:1px dashed var(--line)
    }
    .li:last-child{border-bottom:none}
    .li.cve{background:var(--risk-bg);border:1px solid var(--risk-border);border-radius:10px;padding:10px}

    .datecol{
      color:var(--muted);
      font-size:12px;
      line-height:1.2;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      justify-content:center;
      white-space:nowrap;
    }
    .datecol .day{font-weight:700; color:var(--text)}
    .datecol .time{opacity:.9}

    .avatar{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);object-fit:cover;align-self:center}

    .titleRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .titleRow a{color:var(--link);text-decoration:none;font-weight:700}
    .titleRow a:hover{text-decoration:underline}

    .meta{color:var(--muted);font-size:12px}

    .chips{display:inline-flex;gap:6px;flex-wrap:wrap}
    .chip{background:var(--chip);color:var(--chipText);border:1px solid var(--line);font-size:11px;padding:2px 6px;border-radius:999px;white-space:nowrap}
    .chip.bad{background:rgba(239,68,68,.12);color:var(--bad);border-color:rgba(239,68,68,.35)}
    .chip.warn{background:rgba(245,158,11,.12);color:var(--warn);border-color:rgba(245,158,11,.35)}
    .chip.ok{background:rgba(34,197,94,.12);color:var(--ok);border-color:rgba(34,197,94,.35)}
    .chip.reddit{background:rgba(255,69,0,.15);color:var(--reddit);border-color:rgba(255,69,0,.45)}
    .chip.link a{color:inherit;text-decoration:none}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Releasetrain <b>v3.8.0</b></div>
    <div class="spacer"></div>
    <a class="gh-link" href="https://github.com/SE4CPS/releasetrain-client" target="_blank" rel="noopener">GitHub ↗</a>

    <form id="filterForm" class="controls" aria-label="Filters">
      <div class="field">
        <label for="components">Components</label>
        <input id="components" name="components" type="text" placeholder="aws, chrome, linux" />
      </div>
      <button type="submit">Search</button>
      <button type="button" id="clearBtn" class="secondary">Clear</button>
    </form>

    <div class="togglesWrap" role="group" aria-label="Quick filters (AND)">
      <div class="toggles" id="fixedToggles">
        <button class="toggle" data-key="major" aria-pressed="false" type="button">Major <span class="count" id="btn-major">(0)</span></button>
        <button class="toggle" data-key="minor" aria-pressed="false" type="button">Minor <span class="count" id="btn-minor">(0)</span></button>
        <button class="toggle" data-key="patch" aria-pressed="false" type="button">Patch <span class="count" id="btn-patch">(0)</span></button>
        <button class="toggle" data-key="cve" aria-pressed="false" type="button">CVE <span class="count" id="btn-cve">(0)</span></button>
        <button class="toggle" data-key="reddit" aria-pressed="false" type="button">Reddit <span class="count" id="btn-reddit">(0)</span></button>
        <button class="toggle redditRisk" data-key="reddit-risk" aria-pressed="false" type="button">⚠️ Reddit Risks <span class="count" id="btn-reddit-risk">(0)</span></button>
        <button class="toggle" data-key="mode:component" aria-pressed="true" type="button">Group by component</button>
        <button class="toggle" data-key="mode:date" aria-pressed="false" type="button">Group by date</button>
      </div>
      <div class="toggles" id="typeToggles"></div>
    </div>
  </div>

  <div id="navLoader" class="navloader" aria-hidden="true"></div>

  <main>
    <div class="kpis" role="status" aria-live="polite">
      <div class="kpi">Cards: <em id="kpi-page">0</em></div>
      <div class="kpi" id="kpi-range">Date Range: <em>—</em></div>
      <div class="kpi">Unique Components: <em id="kpi-uniq">0</em></div>
      <div class="kpi">Reddit Posts: <em id="kpi-reddit">0</em></div>
    </div>

    <section class="panel" aria-label="Updates Feed">
      <header>
        <h2 style="margin:0;font-size:16px">Recent Updates</h2>
        <div id="status" class="status">Idle</div>
      </header>

      <div id="feed">
        <div class="skeleton" aria-hidden="true" style="height:80px"></div>
        <div class="skeleton" aria-hidden="true" style="height:80px"></div>
        <div class="skeleton" aria-hidden="true" style="height:80px"></div>
      </div>

      <div id="sentinel" class="sentinel" role="status" aria-live="polite">Loading more…</div>
    </section>
  </main>

  <script>
    // ------- constants & helpers -------
    const API_BASE="https://releasetrain.io/api/", GROUPS_BATCH=6, TOP_TYPES=10, REDDIT_LIMIT=400, MAX_VER_DESC=260;
    const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
    const safe=(v,d="")=>v==null?d:v, uniq=a=>Array.from(new Set(a)), norm=s=>String(s||"").toLowerCase().trim();
    const tokens=s=>uniq(String(s||"").split(",").map(t=>norm(t)).filter(Boolean));
    const truncate=(str,n=MAX_VER_DESC)=> (str && str.length>n)?(str.slice(0,n-1)+"…"):(str||"");

    const dayLabelFromMillis=(ms)=>{
      try{
        const dt=new Date(ms);
        const today=new Date(); today.setHours(0,0,0,0);
        const yest=new Date(today); yest.setDate(today.getDate()-1);
        const dStart=new Date(dt); dStart.setHours(0,0,0,0);
        if(dStart.getTime()===today.getTime()) return "Today";
        if(dStart.getTime()===yest.getTime()) return "Yesterday";
        return dt.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"});
      }catch{ return ""; }
    };
    const shortTime=iso=>{ try{ return new Date(iso).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }catch{ return ""; } };

    const avatarFor=(it)=>{
      const url=(it.versionUrl||"")+""; 
      if(url.includes("github.com/")){const u=url.split("/")[3]; if(u) return `https://github.com/${u}.png`;}
      if(url.startsWith("https://nvd.nist.gov/")) return "./img/cve.png";
      return "./img/default.png";
    };
    const showLoader=()=>{$("#navLoader").classList.add("active");updateOffsets();}, hideLoader=()=>{$("#navLoader").classList.remove("active");updateOffsets();};
    const updateOffsets=()=>{const tb=document.querySelector('.topbar'),nl=$("#navLoader");document.documentElement.style.setProperty('--topbar-h',(tb?tb.offsetHeight:0)+"px");document.documentElement.style.setProperty('--navloader-h',(nl&&nl.classList.contains('active')?nl.offsetHeight:0)+"px");};
    window.addEventListener('load',updateOffsets);window.addEventListener('resize',updateOffsets);new ResizeObserver(updateOffsets).observe(document.querySelector('.topbar'));

    // ------- reddit helpers -------
    const isUpdateRelatedBoolean = p => !!(p?.metadata?.labeled?.isUpdateRelated || p?.metadata?.predicted?.isUpdateRelated);
    const getUpdateScore = p => (typeof p?.metadata?.predicted?.positiveScore==="number")?p.metadata.predicted.positiveScore:null;
    const isRisk = p => isUpdateRelatedBoolean(p) || ((getUpdateScore(p)??-1) > 0.5);
    const scoreBracket = p => {const s=getUpdateScore(p); return s!=null?` [${s.toFixed(4)}]`:"";};

    // ------- API -------
    const Api={
      async versions(qCsv){ const q=qCsv?`?q=${encodeURIComponent(qCsv)}`:""; const url=`${API_BASE}v/${q}`;
        const res=await fetch(url,{headers:{Accept:"application/json"}}); if(!res.ok) throw new Error(`${res.status} ${res.statusText} @ ${url}`);
        const json=await res.json(); return json.versions||[]; },
      async reddit(){ const url=`${API_BASE}reddit/query/positive`;
        const res=await fetch(url,{headers:{Accept:"application/json"}}); if(!res.ok) throw new Error(`${res.status} ${res.statusText} @ ${url}`);
        const json=await res.json(); const list=Array.isArray(json)?json:(json.data||json.posts||json.results||[]);
        return list.map(p=>({ redditId:p.redditId||p._id||p.id, title:p.title, subreddit:p.subreddit, url:p.url,
                              created_utc:p.created_utc||p.createdAt||p.updatedAt, num_comments:p.num_comments, score:p.score, metadata:p.metadata })); }
    };

    // ------- state -------
    const STATE={mode:"component",rawVersions:[],redditAll:[],redditBySub:new Map(),groupsFiltered:[],groupIndex:0,observer:null,loading:false,
      filters:{components:[],toggles:new Set(["mode:component"])}};

    // ------- reddit index / STRICT subreddit match -------
    function buildRedditIndex(list){
      STATE.redditBySub=new Map();
      for(const p of list){
        const k=norm(p.subreddit);
        if(!k) continue;
        if(!STATE.redditBySub.has(k)) STATE.redditBySub.set(k,[]);
        STATE.redditBySub.get(k).push(p);
      }
      for(const arr of STATE.redditBySub.values()){
        arr.sort((a,b)=> (+new Date(b.created_utc||0))-(+new Date(a.created_utc||0)) || (b.score||0)-(a.score||0) );
      }
    }

    // STRICT: ONLY subreddit === versionProductName (normalized)
    function redditMatchesForVersionBase(v, limit = 6, onlyRisks = false) {
      const name = norm(safe(v.versionProductName, ""));
      if (!name) return [];
      let pool = [];
      const arr = STATE.redditBySub.get(name);
      if (arr && arr.length) {
        for (const p of arr) {
          pool.push(p);
          if (pool.length >= limit) break;
        }
      }
      if (onlyRisks) pool = pool.filter(isRisk);
      return pool;
    }

    // ------- grouping by component -------
    function groupByComponent(list){
      const map=new Map();
      for(const v of list){
        const key=`${norm(v.versionProductBrand||"")}|${norm(v.versionProductName||"")}` || "unknown";
        if(!map.has(key)) map.set(key,{ key, brand:v.versionProductBrand||"", name:v.versionProductName||"", items:[] });
        map.get(key).items.push(v);
      }
      const arr=Array.from(map.values());
      // newest activity per component first
      arr.forEach(g=>g.items.sort((a,b)=>(+new Date(b.versionTimestampLastUpdate||b.versionTimestamp||0))-(+new Date(a.versionTimestampLastUpdate||a.versionTimestamp||0))));
      arr.sort((a,b)=> (+new Date(b.items[0]?.versionTimestampLastUpdate||b.items[0]?.versionTimestamp||0)) - (+new Date(a.items[0]?.versionTimestampLastUpdate||a.items[0]?.versionTimestamp||0)) );
      return arr;
    }

    // ------- aggregates / filters -------
    function computeAggregates(list){
      let major=0,minor=0,patch=0,cve=0,reddit=0,redditRisk=0,uniqComps=new Set(),typeCounts=new Map();
      for(const it of list){
        const ch=norm(it.versionReleaseChannel);
        if(ch==="major") major++; else if(ch==="minor") minor++; else if(ch==="patch") patch++;
        if(it.isCve) cve++;
        const allR=redditMatchesForVersionBase(it,6,false), riskR=redditMatchesForVersionBase(it,6,true);
        if(allR.length) reddit++; if(riskR.length) redditRisk++;
        uniqComps.add(`${norm(it.versionProductBrand)}|${norm(it.versionProductName)}`);
        for(const t of (it.classification?.componentType||[])){ if(!t||t==="UNKNOWN") continue; const k=String(t).toLowerCase(); typeCounts.set(k,(typeCounts.get(k)||0)+1); }
      }
      return {major,minor,patch,cve,reddit,redditRisk,uniq:uniqComps.size,typeCounts};
    }
    function paintFixedCounts(a){ $("#btn-major").textContent=`(${a.major})`; $("#btn-minor").textContent=`(${a.minor})`; $("#btn-patch").textContent=`(${a.patch})`;
      $("#btn-cve").textContent=`(${a.cve})`; $("#btn-reddit").textContent=`(${a.reddit})`; $("#btn-reddit-risk").textContent=`(${a.redditRisk})`; $("#kpi-uniq").textContent=a.uniq; }
    function buildTypeButtons(typeCounts){
      const host=$("#typeToggles"); host.innerHTML="";
      const entries=Array.from(typeCounts.entries()).sort((a,b)=>b[1]-a[1]).slice(0,TOP_TYPES);
      if(!entries.length){ host.innerHTML=`<button class="toggle disabled" type="button" aria-disabled="true">No types</button>`; return; }
      for(const [type,count] of entries){
        const btn=document.createElement("button"); btn.className="toggle"; btn.type="button"; btn.dataset.key=`type:${type}`;
        btn.setAttribute("aria-pressed", STATE.filters.toggles.has(`type:${type}`) ? "true" : "false");
        btn.innerHTML=`${type} <span class="count">(${count})</span>`;
        btn.addEventListener("click",()=>{ const key=btn.dataset.key; const on=btn.getAttribute("aria-pressed")==="true";
          btn.setAttribute("aria-pressed",on?"false":"true"); if(on) STATE.filters.toggles.delete(key); else STATE.filters.toggles.add(key); applyFilters(); });
        host.appendChild(btn);
      }
    }
    function matchesToggles(v,rc,rrc){
      const set=STATE.filters.toggles, channel=norm(v.versionReleaseChannel);
      const compTypes=(v.classification?.componentType||[]).map(norm), isCve=!!v.isCve, hasReddit=rc>0, hasRisk=rrc>0;
      const truth={major:channel==="major",minor:channel==="minor",patch:channel==="patch",cve:isCve,reddit:hasReddit,'reddit-risk':hasRisk};
      for(const k of set){
        if(k.startsWith("type:")){ if(!compTypes.includes(k.slice(5))) return false; }
        else if(k==="mode:component"||k==="mode:date"){ /* ignore */ }
        else if(!truth[k]) return false;
      }
      return true;
    }

    function applyFilters(){
      const comps=STATE.filters.components;
      const candidates=STATE.rawVersions.filter(v=>{
        if(!comps.length) return true;
        const name=norm(v.versionProductName), brand=norm(v.versionProductBrand);
        const tags=(Array.isArray(v.versionSearchTags)?v.versionSearchTags.join(","):"").toLowerCase();
        return comps.some(t=>name.includes(t)||brand.includes(t)||tags.includes(t));
      });
      const ag=computeAggregates(candidates); paintFixedCounts(ag); buildTypeButtons(ag.typeCounts);

      const filtered=candidates.filter(v=>{ const r=redditMatchesForVersionBase(v,6,false); const rr=redditMatchesForVersionBase(v,6,true); return matchesToggles(v,r.length,rr.length); });

      $("#kpi-reddit").textContent=STATE.redditAll.length;
      if(filtered.length){
        const getMs=v=>+new Date(v.versionTimestampLastUpdate||v.versionTimestamp||0);
        const min=new Date(Math.min(...filtered.map(getMs))), max=new Date(Math.max(...filtered.map(getMs)));
        $("#kpi-range").innerHTML=`Date Range: <em>${min.toLocaleDateString()} – ${max.toLocaleDateString()}</em>`;
      } else { $("#kpi-range").innerHTML=`Date Range: <em>—</em>`; }

      const wantComponent=STATE.filters.toggles.has("mode:component");
      STATE.mode=wantComponent?"component":"versions";
      STATE.groupsFiltered=wantComponent?groupByComponent(filtered):groupVersionsByDate(filtered);
      $("#feed").innerHTML=""; STATE.groupIndex=0; $("#kpi-page").textContent=wantComponent?STATE.groupsFiltered.length:filtered.length;
      $("#sentinel").textContent=STATE.groupsFiltered.length?"Loading more…":"No results"; appendNextGroups();
      $("#status").textContent=wantComponent?`Grouped by component (${STATE.groupsFiltered.length})`:`Loaded ${filtered.length} items`;
    }

    // ------- rendering helpers -------
    const chip=(t,k)=>`<span class="chip ${k||""}">${t}</span>`;

    function renderGroupNode(group){ // date mode (per-date bucket)
      const det=document.createElement("details"); det.className="feedGroup"; det.open = document.querySelectorAll(".feedGroup").length===0;
      const sum=document.createElement("summary"); sum.innerHTML=`${group.date} <span class="meta">(${group.items.length} updates)</span>`; det.appendChild(sum);
      const wrap=document.createElement("div"); wrap.className="updates";
      group.items
        .slice()
        .sort((a,b)=>(+new Date(b.versionTimestampLastUpdate||b.versionTimestamp||0))-(+new Date(a.versionTimestampLastUpdate||a.versionTimestamp||0)))
        .forEach(it=>wrap.appendChild(renderVersionItem(it)));
      det.appendChild(wrap); return det;
    }

    function renderVersionItem(it){ // used in date mode rows
      const ms=+new Date(it.versionTimestampLastUpdate||it.versionTimestamp||0);
      const row=document.createElement("div"); row.className="li"+(it.isCve?" cve":"");

      // date (left)
      const dcol=document.createElement("div"); dcol.className="datecol";
      dcol.innerHTML = `<div class="day">${dayLabelFromMillis(ms)}</div><div class="time">${shortTime(ms)}</div>`;
      row.appendChild(dcol);

      // avatar
      const img=document.createElement("img"); img.className="avatar"; img.alt=safe(it.versionProductName,"").slice(0,40); img.src=avatarFor(it); row.appendChild(img);

      // body
      const body=document.createElement("div");
      const title=document.createElement("div"); title.className="titleRow";

      // chips FIRST
      const chips=document.createElement("div"); chips.className="chips";
      if(it.isCve){
        chips.insertAdjacentHTML("beforeend", chip("CVE","bad"));
        if(it._id) chips.insertAdjacentHTML("beforeend", `<span class="chip link"><a href="https://releasetrain.io/api/v/${it._id}" target="_blank" rel="noopener">api</a></span>`);
      } else {
        const ch=(it.versionReleaseChannel||"other").toLowerCase();
        const color=ch==="major"?"ok":ch==="patch"?"warn":ch==="minor"?"":"";
        chips.insertAdjacentHTML("beforeend", chip(ch,color));
      }
      title.appendChild(chips);

      // link
      const best=(it.versionUrl?.startsWith("http"))?it.versionUrl:((it.versionReleaseNotes?.startsWith("http"))?it.versionReleaseNotes:"#");
      const a=document.createElement("a"); a.href=best; a.target="_blank"; a.rel="noopener"; a.textContent=`${safe(it.versionProductName,"")} ${it.versionNumber||""}`; title.appendChild(a);

      body.appendChild(title);
      // optional blurb
      const descText = truncate(safe(it.versionReleaseNotes,"")) || safe(it.versionReleaseComments,"");
      if(descText){ const d=document.createElement("div"); d.className="meta"; d.style.opacity=".9"; d.innerHTML=descText; body.appendChild(d); }

      row.appendChild(body);
      return row;
    }

    // ------- COMPONENT MODE: timeline with date on the left, newest first -------
    function renderComponentNode(group){
      const onlyRisks=STATE.filters.toggles.has("reddit-risk");
      const seen=new Set(); let rUnion=[];
      for(const v of group.items){
        for(const p of redditMatchesForVersionBase(v,REDDIT_LIMIT,onlyRisks)){
          const id=p.redditId||p._id||p.id; if(seen.has(id)) continue; seen.add(id); rUnion.push(p);
        }
      }

      const timeline=[];
      for(const v of group.items){
        timeline.push({
          t:+new Date(v.versionTimestampLastUpdate||v.versionTimestamp||0),
          kind:v.isCve?"cve":"update",
          channel:(v.versionReleaseChannel||"other").toLowerCase(),
          label:`${safe(v.versionProductName,"")} ${v.versionNumber||""}`,
          url:(v.versionUrl?.startsWith("http"))?v.versionUrl:((v.versionReleaseNotes?.startsWith("http"))?v.versionReleaseNotes:"#"),
          raw:v
        });
      }
      for(const p of rUnion){
        timeline.push({
          t:+new Date(p.created_utc||0),
          kind:"reddit",
          channel:null,
          label:p.title,
          url:p.url,
          raw:p
        });
      }

      // NEWEST → OLDEST
      timeline.sort((a,b)=>b.t - a.t);

      const det=document.createElement("details"); det.className="feedGroup"; det.open = document.querySelectorAll(".feedGroup").length===0;
      const sum=document.createElement("summary");
      sum.innerHTML = `${group.name}${group.brand ? " — " + group.brand : ""} <span class="meta">(${timeline.length} items)</span>`;
      det.appendChild(sum);

      const wrap=document.createElement("div"); wrap.className="updates";
      const list=document.createElement("div"); list.className="list";

      for(const it of timeline){
        const li=document.createElement("div"); li.className="li"+(it.kind==="cve"?" cve":"");

        // date (left)
        const dcol=document.createElement("div"); dcol.className="datecol";
        dcol.innerHTML = `<div class="day">${dayLabelFromMillis(it.t)}</div><div class="time">${shortTime(it.t)}</div>`;
        li.appendChild(dcol);

        // avatar / reddit dot
        if(it.kind==="reddit"){
          const av=document.createElement("div");
          av.style.width="22px"; av.style.height="22px"; av.style.border=`1px solid var(--line)`;
          av.style.borderRadius="50%"; av.style.background="var(--reddit)"; av.style.alignSelf="center";
          li.appendChild(av);
        }else{
          const av=document.createElement("img"); av.className="avatar"; av.alt=group.name; av.src=avatarFor(it.raw); li.appendChild(av);
        }

        const body=document.createElement("div");
        const title=document.createElement("div"); title.className="titleRow";

        // chips FIRST
        const chips=document.createElement("div"); chips.className="chips";
        if(it.kind==="reddit"){
          chips.insertAdjacentHTML("beforeend", chip("REDDIT","reddit"));
        }else if(it.kind==="cve"){
          chips.insertAdjacentHTML("beforeend", chip("CVE","bad"));
          if(it.raw && it.raw._id){
            chips.insertAdjacentHTML("beforeend", `<span class="chip link"><a href="https://releasetrain.io/api/v/${it.raw._id}" target="_blank" rel="noopener">api</a></span>`);
          }
        }else{
          const ch=it.channel||"other"; const color=ch==="major"?"ok":ch==="patch"?"warn":ch==="minor"?"":"";
          chips.insertAdjacentHTML("beforeend", chip(ch, color));
        }
        title.appendChild(chips);

        // then the link
        const a=document.createElement("a"); a.href=it.url||"#"; a.target="_blank"; a.rel="noopener"; a.textContent=it.label; title.appendChild(a);

        // optional update blurb
        if(it.kind!=="reddit"){
          const descTxt = truncate(safe(it.raw.versionReleaseNotes,"")) || safe(it.raw.versionReleaseComments,"");
          if(descTxt){
            const d=document.createElement("div"); d.className="meta"; d.style.opacity=".9"; d.innerHTML=descTxt;
            body.appendChild(d);
          }
        }

        body.appendChild(title);
        li.appendChild(body);
        list.appendChild(li);
      }

      wrap.appendChild(list);
      det.appendChild(wrap);
      return det;
    }

    // ------- infinite scroll & date mode helpers -------
    function appendNextGroups(){
      if(STATE.loading) return;
      if(STATE.groupIndex>=STATE.groupsFiltered.length){ $("#sentinel").textContent="End of results"; return; }
      STATE.loading=true;
      const feed=$("#feed"); const end=Math.min(STATE.groupIndex+GROUPS_BATCH, STATE.groupsFiltered.length);
      if(STATE.mode==="component"){ for(let i=STATE.groupIndex;i<end;i++) feed.appendChild(renderComponentNode(STATE.groupsFiltered[i])); }
      else { for(let i=STATE.groupIndex;i<end;i++) feed.appendChild(renderGroupNode(STATE.groupsFiltered[i])); }
      STATE.groupIndex=end; STATE.loading=false;
    }
    function setupObserver(){ if(STATE.observer) STATE.observer.disconnect();
      STATE.observer=new IntersectionObserver(es=>{const e=es[0]; if(e&&e.isIntersecting) appendNextGroups();},{rootMargin:"400px 0px"});
      STATE.observer.observe($("#sentinel"));
    }
    function groupVersionsByDate(list){
      const map=new Map();
      for(const v of list){
        const ms=+new Date(v.versionTimestampLastUpdate||v.versionTimestamp||0);
        const label=dayLabelFromMillis(ms);
        if(!map.has(label)) map.set(label,[]);
        map.get(label).push(v);
      }
      const ordered=Array.from(map.entries())
        .map(([label,items])=>({label,items, tMax: Math.max(...items.map(x=>+new Date(x.versionTimestampLastUpdate||x.versionTimestamp||0))) }))
        .sort((a,b)=>b.tMax - a.tMax);
      return ordered.map(x=>({date:x.label,items:x.items}));
    }
    function filterRedditByComponents(all, toks){ if(!toks.length) return all.slice(); return all.filter(p=> toks.some(t=>norm(p.subreddit).includes(t))); }
    function groupRedditBySub(list){ const m=new Map(); for(const p of list){const k="r/"+(norm(p.subreddit)||"unknown"); if(!m.has(k)) m.set(k, []); m.get(k).push(p); }
      const keys=Array.from(m.keys()).sort((a,b)=>m.get(b).length-m.get(a).length); return keys.map(k=>({subreddit:k,posts:m.get(k)})); }
    function applyRedditOnly(){ const comps=STATE.filters.components; let f=filterRedditByComponents(STATE.redditAll,comps); if(STATE.filters.toggles.has('reddit-risk')) f=f.filter(isRisk);
      $("#kpi-page").textContent=0; $("#kpi-range").innerHTML=`Date Range: <em>—</em>`; $("#kpi-uniq").textContent=0; $("#kpi-reddit").textContent=f.length;
      $("#status").textContent = f.length?`No versions found — showing Reddit posts (${f.length})`:`No versions found — no matching Reddit posts`;
      STATE.groupsFiltered=groupRedditBySub(f); STATE.groupIndex=0; $("#feed").innerHTML=""; $("#sentinel").textContent=STATE.groupsFiltered.length?"Loading more…":"No results"; appendNextGroups(); }

    // ------- boot & events -------
    async function boot(){
      $("#status").textContent="Loading…"; showLoader(); $("#feed").innerHTML=""; STATE.groupIndex=0;
      try{
        const u=new URL(location.href); const compCsv=u.searchParams.get("q")||""; const mode=u.searchParams.get("mode");
        $("#components").value=compCsv; STATE.filters.components=tokens(compCsv);
        if(mode==="date"){ STATE.filters.toggles.delete("mode:component"); STATE.filters.toggles.add("mode:date"); $(`#fixedToggles .toggle[data-key="mode:component"]`).setAttribute("aria-pressed","false"); $(`#fixedToggles .toggle[data-key="mode:date"]`).setAttribute("aria-pressed","true"); }
        const [vers, reddit]=await Promise.all([Api.versions(compCsv), Api.reddit().catch(()=>[])]);
        STATE.redditAll=reddit; buildRedditIndex(reddit); $("#kpi-reddit").textContent=reddit.length;
        if(!(vers||[]).length){ STATE.mode="reddit-only"; applyRedditOnly(); $("#status").textContent=`Loaded Reddit (${reddit.length})`; return; }
        vers.sort((a,b)=>(+new Date(b.versionTimestampLastUpdate||b.versionTimestamp||0))-(+new Date(a.versionTimestampLastUpdate||a.versionTimestamp||0)));
        STATE.rawVersions=vers; STATE.mode=STATE.filters.toggles.has("mode:component")?"component":"versions"; applyFilters();
      }catch(e){ console.error(e); $("#feed").innerHTML=`<div class="meta">Error: ${e.message}</div>`; $("#status").textContent="Failed to load"; }
      finally{ hideLoader(); }
    }

    $("#filterForm").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const compCsv=$("#components").value.trim().replace(/\s+/g,''); const u=new URL(location.href);
      if(compCsv) u.searchParams.set("q",compCsv); else u.searchParams.delete("q"); history.replaceState({}, "", u.toString());
      $("#status").textContent="Filtering…"; showLoader();
      try{
        STATE.filters.components=tokens(compCsv);
        const vers=await Api.versions(compCsv);
        if(!(vers||[]).length){ STATE.mode="reddit-only"; applyRedditOnly(); return; }
        vers.sort((a,b)=>(+new Date(b.versionTimestampLastUpdate||b.versionTimestamp||0))-(+new Date(a.versionTimestampLastUpdate||a.versionTimestamp||0)));
        STATE.rawVersions=vers; applyFilters(); $("#status").textContent=`Filtered (${vers.length})`;
      }catch(e){ console.error(e); $("#status").textContent="Filter failed"; }
      finally{ hideLoader(); }
    });

    $("#clearBtn").addEventListener("click", ()=>{ $("#components").value=""; STATE.filters.components=[]; const u=new URL(location.href); u.searchParams.delete("q"); u.searchParams.delete("mode"); history.replaceState({}, "", u.toString()); STATE.filters.toggles=new Set(["mode:component"]); $$('#fixedToggles .toggle, #typeToggles .toggle').forEach(b=>b.setAttribute('aria-pressed','false')); $(`#fixedToggles .toggle[data-key="mode:component"]`).setAttribute('aria-pressed','true'); boot(); });

    $("#fixedToggles").addEventListener("click",(e)=>{
      const btn=e.target.closest(".toggle"); if(!btn||btn.classList.contains("disabled")) return;
      const key=btn.dataset.key; const on=btn.getAttribute("aria-pressed")==="true";
      if(key==="mode:component"||key==="mode:date"){
        $$('#fixedToggles .toggle[data-key="mode:component"], #fixedToggles .toggle[data-key="mode:date"]').forEach(b=>{b.setAttribute("aria-pressed","false"); STATE.filters.toggles.delete(b.dataset.key);});
        btn.setAttribute("aria-pressed","true"); STATE.filters.toggles.add(key);
        const u=new URL(location.href); if(key==="mode:date") u.searchParams.set("mode","date"); else u.searchParams.delete("mode"); history.replaceState({}, "", u.toString());
      }else{
        btn.setAttribute("aria-pressed", on?"false":"true"); if(on) STATE.filters.toggles.delete(key); else STATE.filters.toggles.add(key);
      }
      applyFilters();
    });

    setupObserver(); boot();
  </script>
</body>
