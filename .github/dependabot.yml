version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Biome only lints one small test file; a major/minor bump means a
      # config migration for little gain. Patch updates only.
      - dependency-name: "@biomejs/biome"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
