<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Releasetrain — Update Feed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Release updates grouped by component — last 6 months" />
  <style>
    /* ── Design tokens ──────────────────────────────────────── */
    :root {
      --bg:       #f8f9fb;
      --panel:    #ffffff;
      --text:     #1a1d23;
      --muted:    #5c6470;
      --brand:    #2563eb;
      --brand-fg: #ffffff;
      --line:     #d4d8df;
      --chip:     #eef0f3;
      --chipText: #374151;
      --focus:    #2563eb;

      --bad:    #b91c1c;  --bad-bg:  #fef2f2;
      --warn:   #c2410c;  --warn-bg: #fff7ed;
      --ok:     #166534;  --ok-bg:   #f0fdf4;
      --info:   #0369a1;  --info-bg: #f0f9ff;

      --link:   #1d4ed8;
      --shadow: 0 2px 8px rgba(0,0,0,.08);
      --rad:    10px;
      --topbar-h: 0px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:       #0f1117;
        --panel:    #1a1f2e;
        --text:     #f1f3f7;
        --muted:    #9ca3af;
        --brand:    #3b82f6;
        --brand-fg: #ffffff;
        --line:     #2d3548;
        --chip:     #212840;
        --chipText: #d1d5db;
        --focus:    #60a5fa;

        --bad:    #f87171;  --bad-bg:  #2d1515;
        --warn:   #fb923c;  --warn-bg: #2d1a0a;
        --ok:     #4ade80;  --ok-bg:   #0d2618;
        --info:   #38bdf8;  --info-bg: #0c2233;

        --link:   #93c5fd;
        --shadow: 0 4px 14px rgba(0,0,0,.5);
      }
    }

    /* ── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.6 system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    img { display: block; }

    /* ── Skip link ──────────────────────────────────────────── */
    .skip-link {
      position: absolute; top: -100%; left: 8px;
      padding: 8px 14px;
      background: var(--brand); color: var(--brand-fg);
      border-radius: 0 0 var(--rad) var(--rad);
      font-weight: 700; text-decoration: none; z-index: 9999;
    }
    .skip-link:focus { top: 0; }

    /* ── Topbar ─────────────────────────────────────────────── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 1000;
      background: var(--panel);
      border-bottom: 2px solid var(--line);
      box-shadow: var(--shadow);
    }

    /* Row 1: brand + search + nav — all in one line on wide screens */
    .topbar-main {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      flex-wrap: wrap;
    }
    .brand {
      font-size: 15px; font-weight: 800; letter-spacing: .2px;
      white-space: nowrap; flex-shrink: 0;
    }
    .brand b { color: var(--brand); }

    /* Search form sits in the middle, grows to fill space */
    #filterForm {
      display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
      flex: 1 1 260px;
    }
    .search-label { font: 600 12px/1 inherit; color: var(--muted); white-space: nowrap; }
    .search-input {
      flex: 1 1 160px; min-width: 0;
      padding: 6px 11px;
      border: 1.5px solid var(--line); border-radius: var(--rad);
      background: var(--panel); color: var(--text); font: inherit;
    }
    .search-input:focus { outline: 3px solid var(--focus); outline-offset: 0; border-color: var(--brand); }

    .btn {
      padding: 6px 14px;
      border: 1.5px solid transparent; border-radius: var(--rad);
      background: var(--brand); color: var(--brand-fg);
      font: 700 13px/1 inherit; cursor: pointer; white-space: nowrap;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .btn.secondary { background: var(--panel); color: var(--text); border-color: var(--line); }
    .btn.secondary:hover { background: var(--chip); }
    .btn.ghost {
      background: none; color: var(--muted); border-color: var(--line);
      font-size: 12px; padding: 4px 10px;
    }
    .btn.ghost:hover { color: var(--text); background: var(--chip); }

    /* Nav links at far right */
    .nav-links {
      display: flex; gap: 5px; align-items: center; flex-shrink: 0; flex-wrap: wrap;
    }
    .nav-link {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 10px;
      border: 1.5px solid var(--line); border-radius: var(--rad);
      background: var(--chip); color: var(--link);
      font: 700 12px/1 inherit; text-decoration: none; white-space: nowrap;
    }
    .nav-link:hover { background: var(--line); }
    .nav-link:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .nav-link.gh { color: var(--text); }
    .nav-link small { color: var(--muted); font-weight: 600; }

    /* Row 2: filter toggles */
    .topbar-filters {
      display: flex; flex-direction: column; gap: 5px;
      padding: 0 14px 8px;
    }
    .toggles {
      display: flex; gap: 5px; flex-wrap: wrap;
    }
    @media (max-width: 640px) {
      .toggles {
        flex-wrap: nowrap; overflow-x: auto;
        -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px;
      }
      .toggles::-webkit-scrollbar { display: none; }
    }
    .toggle {
      flex-shrink: 0; padding: 4px 10px;
      border: 1.5px solid var(--line); border-radius: var(--rad);
      background: var(--chip); color: var(--chipText);
      font: 600 11px/1 inherit; cursor: pointer; white-space: nowrap;
    }
    .toggle:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .toggle[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); }
    .toggle.disabled { opacity: .45; cursor: not-allowed; }
    .toggle.redditRisk,
    .toggle.soRisk,
    .toggle.potentialCve { border-color: var(--warn); color: var(--warn); background: var(--warn-bg); }
    .toggle.redditRisk[aria-pressed="true"],
    .toggle.soRisk[aria-pressed="true"],
    .toggle.potentialCve[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #fff; }

    /* Active filter indicator strip */
    #activeFilters {
      display: none;
      padding: 3px 14px 6px;
      gap: 5px;
      flex-wrap: wrap;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }
    #activeFilters.visible { display: flex; }
    #activeFilters span { font-weight: 700; color: var(--text); }
    .af-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 7px;
      background: var(--brand); color: var(--brand-fg);
      border-radius: 99px; font-weight: 600; font-size: 11px;
    }
    .af-clear {
      margin-left: auto; cursor: pointer; text-decoration: underline;
      font-size: 11px; color: var(--muted);
      background: none; border: none; padding: 0; font: inherit;
    }
    .af-clear:hover { color: var(--text); }

    /* ── Nav loader ─────────────────────────────────────────── */
    #navLoader {
      position: fixed; top: var(--topbar-h); left: 0; right: 0;
      height: 3px; background: transparent; overflow: hidden; z-index: 999; display: none;
    }
    #navLoader.active { display: block; }
    #navLoader::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: linear-gradient(90deg, var(--brand), #93c5fd, var(--brand));
      animation: slide 1s linear infinite;
    }
    @keyframes slide { from { margin-left: -40%; } to { margin-left: 100%; } }

    /* ── Main ───────────────────────────────────────────────── */
    main {
      max-width: 1100px; margin: 0 auto;
      padding: calc(var(--topbar-h) + 14px) 14px 32px;
    }

    /* ── KPI strip ──────────────────────────────────────────── */
    .kpis { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .kpi {
      padding: 5px 12px;
      border: 1.5px solid var(--line); border-radius: var(--rad);
      background: var(--panel); color: var(--chipText);
      font: 600 12px/1 inherit;
    }
    .kpi em { font-style: normal; color: var(--brand); font-weight: 800; }

    /* ── Feed panel ─────────────────────────────────────────── */
    .panel {
      background: var(--panel);
      border: 1.5px solid var(--line); border-radius: var(--rad);
      box-shadow: var(--shadow); overflow: hidden;
    }
    .panel-header {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 14px 9px;
      border-bottom: 1px solid var(--line);
    }
    .panel-header h2 { margin: 0; font-size: 15px; flex: 1; }
    .panel-header h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }
    #status { color: var(--muted); font-size: 12px; }

    /* ── Empty state ────────────────────────────────────────── */
    #emptyState {
      display: none;
      padding: 48px 20px;
      text-align: center;
      color: var(--muted);
    }
    #emptyState.show { display: block; }
    #emptyState p { margin: 4px 0 0; font-size: 13px; }

    /* ── Feed groups ────────────────────────────────────────── */
    #feed { padding: 8px 10px 2px; }

    .feedGroup {
      border: 1.5px solid var(--line); border-radius: var(--rad);
      overflow: hidden; margin-bottom: 8px; background: var(--panel);
    }

    /* Summary with animated chevron */
    summary {
      cursor: pointer; list-style: none; user-select: none;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 9px 12px;
      font-weight: 700; font-size: 13px;
      background: var(--chip);
    }
    summary:hover { background: var(--line); }
    summary:focus-visible { outline: 3px solid var(--focus); outline-offset: -2px; }
    summary::-webkit-details-marker { display: none; }

    /* chevron */
    summary::before {
      content: "▶";
      font-size: 9px;
      color: var(--muted);
      flex-shrink: 0;
      transition: transform .18s ease;
    }
    details[open] > summary::before { transform: rotate(90deg); }

    .summaryRight { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }

    /* ── Timeline items ─────────────────────────────────────── */
    .updates { padding: 4px 10px 2px; }
    .list { display: flex; flex-direction: column; }

    .li {
      display: grid;
      grid-template-columns: 110px 26px 1fr;
      column-gap: 10px;
      padding: 9px 0 9px 8px;
      border-bottom: 1px solid var(--line);
      border-left: 3px solid transparent;
      align-items: start;
    }
    .li:last-child { border-bottom: none; }

    /* Color-coded left border by kind */
    .li.kind-cve        { border-left-color: var(--bad);   background: var(--bad-bg);  border-radius: 6px; padding: 9px 0 9px 8px; margin: 3px 0; }
    .li.kind-reddit.risk{ border-left-color: var(--warn); }
    .li.kind-update.major { border-left-color: var(--ok); }
    .li.kind-update.cve   { border-left-color: var(--bad); }

    /* Mobile: stack date below */
    @media (max-width: 600px) {
      .li { grid-template-columns: 26px 1fr; grid-template-rows: auto auto; }
      .datecol {
        grid-column: 1 / -1; grid-row: 2;
        flex-direction: row; justify-content: flex-start;
        gap: 6px; padding: 4px 0 0; align-items: center;
      }
    }

    .datecol {
      color: var(--muted); font-size: 11px;
      display: flex; flex-direction: column;
      align-items: flex-end; justify-content: flex-start;
      padding-top: 2px; white-space: nowrap;
    }
    .datecol .day { font-weight: 700; color: var(--text); font-size: 11px; }
    .datecol .time { opacity: .8; }

    .avatar {
      width: 22px; height: 22px; border-radius: 5px;
      border: 1.5px solid var(--line); object-fit: cover;
      background: var(--chip); margin-top: 2px;
    }
    .redditIcon       { border-color: var(--warn); background: var(--warn-bg); }
    .redditIcon.risky { border-color: var(--bad);  background: var(--bad-bg); }
    .soIcon           { border-color: var(--line);  background: var(--chip); }
    .soIcon.risky     { border-color: var(--bad);  background: var(--bad-bg); }

    /* ── Chips ──────────────────────────────────────────────── */
    .chips { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 3px; }
    .chip {
      display: inline-flex; align-items: center;
      padding: 2px 7px; font: 600 10px/1.4 inherit;
      border-radius: 5px; border: 1px solid var(--line);
      background: var(--chip); color: var(--chipText); white-space: nowrap;
    }
    .chip.bad    { background: var(--bad-bg);  border-color: var(--bad);  color: var(--bad); }
    .chip.warn   { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
    .chip.ok     { background: var(--ok-bg);   border-color: var(--ok);   color: var(--ok); }
    .chip.reddit { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
    .chip.soft   { opacity: .85; }
    .chip.link a { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
    .chip.link a:hover { color: var(--brand); }
    .chip.potentialCveBadge { margin-right: 2px; }
    .potentialCveChips { margin-top: 3px; gap: 3px; }
    .chip.potentialCveChip { background: var(--panel); border-color: var(--warn); color: var(--warn); }
    .chip.potentialCveChip:hover { background: var(--warn-bg); }

    .titleRow {
      display: flex; gap: 5px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 1px;
    }
    .titleRow a {
      color: var(--link); font-weight: 700;
      text-decoration: underline; text-underline-offset: 2px; word-break: break-word;
      font-size: 13px;
    }
    .titleRow a:hover { color: var(--brand); }
    .titleRow a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 2px; }

    .meta {
      color: var(--muted); font-size: 12px; line-height: 1.5;
      margin-top: 2px; word-break: break-word;
    }

    /* ── Skeleton / sentinel ────────────────────────────────── */
    .skeleton {
      border-radius: var(--rad);
      background: linear-gradient(90deg, var(--chip), var(--line), var(--chip));
      background-size: 200% 100%;
      animation: pulse 1.4s ease-in-out infinite;
      margin-bottom: 8px;
    }
    @keyframes pulse { from { background-position: 0 0; } to { background-position: 200% 0; } }

    .sentinel { font-size: 12px; text-align: center; color: var(--muted); padding: 12px 0 6px; }
  </style>
</head>
<body>

<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="topbar" role="banner">

  <!-- Single row: brand · search · nav -->
  <div class="topbar-main">
    <span class="brand">Releasetrain <b>v3.13.3</b></span>

    <form id="filterForm" aria-label="Component search">
      <label class="search-label" for="components">Components</label>
      <input id="components" name="components" class="search-input" type="text"
             placeholder="aws, chrome, firefox, linux"
             autocomplete="off" spellcheck="false" />
      <button class="btn" type="submit">Search</button>
      <button class="btn secondary" type="button" id="clearBtn">Clear</button>
    </form>

    <nav class="nav-links" aria-label="Views">
      <a id="graphLink" class="nav-link" href="/graph/" title="Graph view">Graph ↗ <small>/graph</small></a>
      <a id="archLink"  class="nav-link" href="/arch/"  title="Architecture view">Arch ↗ <small>/arch</small></a>
      <a class="nav-link gh" href="https://github.com/SE4CPS/releasetrain-client" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </nav>
  </div>

  <!-- Filter toggles -->
  <div class="topbar-filters">
    <div class="toggles" id="fixedToggles" role="group" aria-label="Quick filters">
      <button class="toggle" data-key="major"           aria-pressed="false" type="button">Major <span id="btn-major">(0)</span></button>
      <button class="toggle" data-key="minor"           aria-pressed="false" type="button">Minor <span id="btn-minor">(0)</span></button>
      <button class="toggle" data-key="patch"           aria-pressed="false" type="button">Patch <span id="btn-patch">(0)</span></button>
      <button class="toggle" data-key="cve"             aria-pressed="false" type="button">CVE <span id="btn-cve">(0)</span></button>
      <button class="toggle potentialCve" data-key="potential-cve" aria-pressed="false" type="button"
              title="Versions with Reddit discussions mentioning both latest update and CVE">
        Potential CVE <span id="btn-potential-cve">(0)</span>
      </button>
      <button class="toggle" data-key="reddit"          aria-pressed="false" type="button">Reddit <span id="btn-reddit">(0)</span></button>
      <button class="toggle redditRisk" data-key="reddit-risk" aria-pressed="false" type="button"
              title="AI-detected isUpdateRelated or score > 0.5">
        ⚠ Reddit Risks <span id="btn-reddit-risk">(0)</span>
      </button>
      <button class="toggle redditRisk" data-key="reddit-risk-latest" aria-pressed="false" type="button"
              title="Risky Reddit posts about latest updates">
        ⚠ Reddit Risk Latest <span id="btn-reddit-risk-latest">(0)</span>
      </button>
      <button class="toggle redditRisk" data-key="reddit-risk-cve" aria-pressed="false" type="button"
              title="Risky Reddit posts about security/CVE">
        ⚠ Reddit Risk Security <span id="btn-reddit-risk-cve">(0)</span>
      </button>
      <button class="toggle soRisk" data-key="so-risk"  aria-pressed="false" type="button"
              title="AI-detected isUpdateRelated or score > 0.5 (StackOverflow)">
        ⚠ SO Risks <span id="btn-so-risk">(0)</span>
      </button>
    </div>
    <div class="toggles" id="typeToggles" role="group" aria-label="Component type filters"></div>
  </div>

  <!-- Active filter strip -->
  <div id="activeFilters" aria-live="polite" aria-label="Active filters">
    <span>Active:</span>
    <div id="afTags"></div>
    <button class="af-clear" type="button" id="afClearAll">Clear all filters</button>
  </div>

</header>

<div id="navLoader" role="progressbar" aria-label="Loading" aria-hidden="true"></div>

<main id="main-content">

  <div class="kpis" role="status" aria-live="polite" aria-label="Summary statistics">
    <div class="kpi">Groups: <em id="kpi-page">0</em></div>
    <div class="kpi" id="kpi-range">Range: <em>—</em></div>
    <div class="kpi">Components: <em id="kpi-uniq">0</em></div>
    <div class="kpi">Reddit Posts: <em id="kpi-reddit">0</em></div>
  </div>

  <section class="panel" aria-label="Updates feed">
    <header class="panel-header">
      <h2>Recent Updates <small>(last 6 months)</small></h2>
      <button class="btn ghost" type="button" id="expandAllBtn" title="Expand or collapse all groups">Expand all</button>
      <div id="status" class="status" aria-live="polite">Idle</div>
    </header>

    <div id="emptyState">
      <p>No updates match the current filters.</p>
    </div>

    <div id="feed">
      <div class="skeleton" aria-hidden="true" style="height:68px"></div>
      <div class="skeleton" aria-hidden="true" style="height:68px"></div>
      <div class="skeleton" aria-hidden="true" style="height:68px"></div>
    </div>

    <div id="sentinel" class="sentinel" role="status" aria-live="polite">Loading more…</div>
  </section>

</main>

<script>
/* ── Constants ────────────────────────────────────────────── */
const API_BASE    = "https://releasetrain.io/api/";
const GROUPS_BATCH = 6, TOP_TYPES = 10, REDDIT_LIMIT = 400, MAX_VER_DESC = 220;
const SIX_MONTHS_MS  = 1000 * 60 * 60 * 24 * 180;
const SIX_MONTHS_AGO = Date.now() - SIX_MONTHS_MS;

/* ── DOM cache ────────────────────────────────────────────── */
const EL = {};
["feed","sentinel","status","navLoader","kpi-page","kpi-range","kpi-uniq","kpi-reddit",
 "btn-major","btn-minor","btn-patch","btn-cve","btn-potential-cve","btn-reddit",
 "btn-reddit-risk","btn-reddit-risk-latest","btn-reddit-risk-cve","btn-so-risk",
 "filterForm","components","clearBtn","fixedToggles","typeToggles",
 "graphLink","archLink","expandAllBtn","activeFilters","afTags","afClearAll","emptyState"
].forEach(id => { EL[id] = document.getElementById(id); });

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

/* ── Helpers ──────────────────────────────────────────────── */
const safe      = (v, d="") => v == null ? d : v;
const uniq      = a => Array.from(new Set(a));
const truncate  = (str, n=MAX_VER_DESC) => str && str.length > n ? str.slice(0, n-1) + "…" : (str || "");
const norm      = s => String(s || "").toLowerCase().trim();
const normKey   = s => norm(s).replace(/[^a-z0-9]+/g, " ").replace(/\s+/g, " ").trim();
const titleCase = s => s ? s.replace(/\w\S*/g, w => w[0].toUpperCase() + w.slice(1)) : s;
const tokens    = s => uniq(String(s || "").split(",").map(t => norm(t)).filter(Boolean));

const GENERIC_WORDS = new Set(["project","org","organization","team","labs","systems","software",
  "tech","technologies","dev","development","opensource","open","source"]);

const dayLabelFromMillis = ms => {
  try {
    const dt = new Date(ms);
    const today = new Date(); today.setHours(0,0,0,0);
    const yest  = new Date(today); yest.setDate(today.getDate() - 1);
    const dStart = new Date(dt); dStart.setHours(0,0,0,0);
    if (dStart.getTime() === today.getTime()) return "Today";
    if (dStart.getTime() === yest.getTime())  return "Yesterday";
    return dt.toLocaleDateString(undefined, { month:"short", day:"numeric" });
  } catch { return ""; }
};
const shortTime = iso => {
  try { return new Date(iso).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" }); }
  catch { return ""; }
};
const avatarFor = it => {
  const url = (it.versionUrl || "") + "";
  if (it.isCve) return "./img/cve.png";
  if (url.includes("github.com/")) { const u = url.split("/")[3]; if (u) return `https://github.com/${u}.png`; }
  if (url.startsWith("https://nvd.nist.gov/")) return "./img/cve.png";
  return "./img/default.png";
};

function updateOffsets() {
  const tb = $(".topbar");
  document.documentElement.style.setProperty("--topbar-h", (tb ? tb.offsetHeight : 0) + "px");
}
window.addEventListener("load", updateOffsets);
window.addEventListener("resize", updateOffsets);
new ResizeObserver(updateOffsets).observe($(".topbar"));

const encodeCsvKeepCommas = csv => {
  const cleaned = String(csv || "").replace(/ /g, " ").replace(/\s*,\s*/g, ",").trim();
  if (!cleaned) return "";
  return cleaned.split(",").map(t => encodeURIComponent(t)).join(",");
};

function buildHrefWithQ(path, csv) {
  const q  = String(csv || "").trim();
  const qs = q ? `?q=${encodeCsvKeepCommas(q)}` : "";
  const base = path.startsWith("/") ? path : `/${path}`;
  return `${location.origin}${base}${qs}`;
}

function setLinksHref() {
  const q = new URL(location.href).searchParams.get("q") || "";
  EL.graphLink.href = buildHrefWithQ("/graph/", q);
  EL.archLink.href  = buildHrefWithQ("/arch/",  q);
}

/* ── Post helpers ─────────────────────────────────────────── */
function getPostSource(p) {
  const s = norm(p?.source || "");
  if (s) return s;
  const url = String(p?.url || "");
  if (url.includes("stackoverflow.com")) return "stackoverflow";
  return "reddit";
}
const getPostId = p => p?.redditId || p?._id || p?.id || "";
const isUpdateRelatedBoolean = p => !!(p?.metadata?.labeled?.isUpdateRelated || p?.metadata?.predicted?.isUpdateRelated);
const getUpdateScore = p => typeof p?.metadata?.predicted?.positiveScore === "number" ? p.metadata.predicted.positiveScore : null;
const isRisk = p => isUpdateRelatedBoolean(p) || ((getUpdateScore(p) ?? -1) > 0.5);

/* ── API ──────────────────────────────────────────────────── */
const Api = {
  async versions(qCsv) {
    const q   = qCsv ? `?q=${encodeCsvKeepCommas(qCsv)}` : "";
    const url = `${API_BASE}v/${q}`;
    const res = await fetch(url, { headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    return (await res.json()).versions || [];
  },
  async reddit() {
    const res = await fetch(`${API_BASE}reddit/query/positive`, { headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const list = await res.json();
    const arr  = Array.isArray(list) ? list : (list.data || list.posts || list.results || []);
    return arr.map(p => ({
      redditId: p.redditId || p._id || p.id,
      title: p.title, subreddit: p.subreddit, url: p.url,
      created_utc: p.created_utc || p.createdAt || p.updatedAt,
      num_comments: p.num_comments, score: p.score,
      metadata: p.metadata, source: p.source,
      isAboutLatestUpdate: p.isAboutLatestUpdate, isAboutCve: p.isAboutCve
    }));
  }
};

/* ── Canon names ──────────────────────────────────────────── */
const canonComponentName = v => {
  const display = titleCase((v && v.versionProductName) || "");
  return { key: normKey(display), nameOut: display };
};

/* ── State ────────────────────────────────────────────────── */
const STATE = {
  rawVersions: [], redditAll: [],
  redditBySub: new Map(), redditByUrl: new Map(),
  groupsFiltered: [], groupIndex: 0,
  observer: null, loading: false,
  filters: { components: [], toggles: new Set() },
  expandedAll: false
};

/* ── Reddit indexing ──────────────────────────────────────── */
function getSourceCounts() {
  let reddit = 0, stackoverflow = 0;
  for (const p of STATE.redditAll) {
    if (norm(p.source || "") === "stackoverflow") stackoverflow++; else reddit++;
  }
  return { reddit, stackoverflow };
}

function buildRedditIndex(list) {
  STATE.redditBySub = new Map(); STATE.redditByUrl = new Map();
  for (const p of list) {
    const k = norm(p.subreddit); if (!k) continue;
    if (!STATE.redditBySub.has(k)) STATE.redditBySub.set(k, []);
    STATE.redditBySub.get(k).push(p);
    if (p.url) STATE.redditByUrl.set(String(p.url), p);
  }
  for (const arr of STATE.redditBySub.values())
    arr.sort((a, b) => (+new Date(b.created_utc||0)) - (+new Date(a.created_utc||0)) || (b.score||0)-(a.score||0));
}

function redditMatchesForVersionBase(v, limit=6, onlyRisks=false) {
  const name = norm(canonComponentName(v).nameOut); if (!name) return [];
  const arr = STATE.redditBySub.get(name) || [], out = [];
  for (const p of arr) {
    if (getPostSource(p) !== "reddit") continue;
    if (+new Date(p.created_utc||0) < SIX_MONTHS_AGO) continue;
    if (onlyRisks && !isRisk(p)) continue;
    out.push(p); if (out.length >= limit) break;
  }
  return out;
}

function stackoverflowMatchesForVersionBase(v, limit=6, onlyRisks=false) {
  const name = norm(canonComponentName(v).nameOut); if (!name) return [];
  const arr = STATE.redditBySub.get(name) || [], out = [];
  for (const p of arr) {
    if (getPostSource(p) !== "stackoverflow") continue;
    if (+new Date(p.created_utc||0) < SIX_MONTHS_AGO) continue;
    if (onlyRisks && !isRisk(p)) continue;
    out.push(p); if (out.length >= limit) break;
  }
  return out;
}

/* ── Grouping ─────────────────────────────────────────────── */
function groupByComponentName(list) {
  const map = new Map();
  for (const v of list) {
    const c = canonComponentName(v);
    if (!map.has(c.key)) map.set(c.key, { key: c.key, name: c.nameOut, items: [] });
    map.get(c.key).items.push(v);
  }
  const arr = Array.from(map.values());
  arr.forEach(g => g.items.sort((a,b) => (+new Date(b.versionTimestampLastUpdate||b.versionTimestamp||0)) - (+new Date(a.versionTimestampLastUpdate||a.versionTimestamp||0))));
  arr.sort((a,b) => (+new Date(b.items[0]?.versionTimestampLastUpdate||b.items[0]?.versionTimestamp||0)) - (+new Date(a.items[0]?.versionTimestampLastUpdate||a.items[0]?.versionTimestamp||0)));
  return arr;
}

/* ── Aggregates ───────────────────────────────────────────── */
function computeAggregates(list) {
  let major=0,minor=0,patch=0,cve=0; const uniqComps=new Set(), typeCounts=new Map();
  const rIds=new Set(), rRiskIds=new Set(), rRiskLatIds=new Set(), rRiskCveIds=new Set(), soRiskIds=new Set();
  let potentialCve=0;
  for (const it of list) {
    const ch = norm(it.versionReleaseChannel);
    if (ch==="major") major++; else if (ch==="minor") minor++; else if (ch==="patch") patch++;
    if (it.isCve) cve++;
    for (const p of redditMatchesForVersionBase(it, REDDIT_LIMIT, false)) if (getPostSource(p)==="reddit") rIds.add(getPostId(p));
    for (const p of redditMatchesForVersionBase(it, REDDIT_LIMIT, true)) if (getPostSource(p)==="reddit") {
      const id=getPostId(p); rRiskIds.add(id);
      if (p.isAboutLatestUpdate) rRiskLatIds.add(id);
      if (p.isAboutCve) rRiskCveIds.add(id);
    }
    const mltlSrc = it.mltl && Array.isArray(it.mltl.src) ? it.mltl.src : [];
    const potPosts = mltlSrc.map(u => STATE.redditByUrl.get(String(u))).filter(p => p?.isAboutLatestUpdate && p?.isAboutCve);
    if (potPosts.length) potentialCve++;
    for (const p of stackoverflowMatchesForVersionBase(it, REDDIT_LIMIT, true)) if (getPostSource(p)==="stackoverflow") soRiskIds.add(getPostId(p));
    uniqComps.add(canonComponentName(it).key);
    for (const t of (it.classification?.componentType||[])) {
      if (!t||t==="UNKNOWN") continue;
      const k=String(t).toLowerCase(); typeCounts.set(k,(typeCounts.get(k)||0)+1);
    }
  }
  return { major,minor,patch,cve, reddit:rIds.size, redditRisk:rRiskIds.size,
    redditRiskLatest:rRiskLatIds.size, redditRiskCve:rRiskCveIds.size,
    soRisk:soRiskIds.size, potentialCve, uniq:uniqComps.size, typeCounts };
}

function paintFixedCounts(a) {
  EL["btn-major"].textContent            = `(${a.major})`;
  EL["btn-minor"].textContent            = `(${a.minor})`;
  EL["btn-patch"].textContent            = `(${a.patch})`;
  EL["btn-cve"].textContent              = `(${a.cve})`;
  EL["btn-potential-cve"].textContent    = `(${a.potentialCve})`;
  EL["btn-reddit"].textContent           = `(${a.reddit})`;
  EL["btn-reddit-risk"].textContent      = `(${a.redditRisk})`;
  EL["btn-reddit-risk-latest"].textContent = `(${a.redditRiskLatest})`;
  EL["btn-reddit-risk-cve"].textContent  = `(${a.redditRiskCve})`;
  EL["btn-so-risk"].textContent          = `(${a.soRisk})`;
  EL["kpi-uniq"].textContent             = a.uniq;
}

/* ── Active filter display ────────────────────────────────── */
function refreshActiveFilters() {
  const set = STATE.filters.toggles;
  if (!set.size) { EL.activeFilters.classList.remove("visible"); return; }
  EL.activeFilters.classList.add("visible");
  EL.afTags.innerHTML = [...set].map(k => `<span class="af-tag">${k}</span>`).join("");
}

/* ── Type buttons ─────────────────────────────────────────── */
function buildTypeButtons(typeCounts) {
  EL.typeToggles.innerHTML = "";
  const entries = Array.from(typeCounts.entries()).sort((a,b)=>b[1]-a[1]).slice(0,TOP_TYPES);
  if (!entries.length) {
    EL.typeToggles.innerHTML = `<button class="toggle disabled" type="button" aria-disabled="true">No types</button>`;
    return;
  }
  for (const [type,count] of entries) {
    const btn = document.createElement("button");
    btn.className = "toggle"; btn.type = "button"; btn.dataset.key = `type:${type}`;
    btn.setAttribute("aria-pressed", STATE.filters.toggles.has(`type:${type}`) ? "true" : "false");
    btn.innerHTML = `${type} <span>(${count})</span>`;
    btn.addEventListener("click", () => {
      const key = btn.dataset.key, on = btn.getAttribute("aria-pressed") === "true";
      btn.setAttribute("aria-pressed", on ? "false" : "true");
      on ? STATE.filters.toggles.delete(key) : STATE.filters.toggles.add(key);
      refreshActiveFilters(); applyFilters();
    });
    EL.typeToggles.appendChild(btn);
  }
}

/* ── Toggle matching ──────────────────────────────────────── */
function matchesToggles(v, rc, rRiskCount, soCount, soRiskCount, rRiskLatestCount, rRiskCveCount, hasPotentialCve) {
  const set = STATE.filters.toggles, channel = norm(v.versionReleaseChannel);
  const compTypes = (v.classification?.componentType||[]).map(norm);
  const truth = {
    major: channel==="major", minor: channel==="minor", patch: channel==="patch",
    cve: !!v.isCve, reddit: rc>0,
    "reddit-risk": rRiskCount>0, "reddit-risk-latest": rRiskLatestCount>0,
    "reddit-risk-cve": rRiskCveCount>0, "so-risk": soRiskCount>0,
    "potential-cve": hasPotentialCve
  };
  for (const k of set) {
    if (k.startsWith("type:")) { if (!compTypes.includes(k.slice(5))) return false; }
    else if (!truth[k]) return false;
  }
  return true;
}

/* ── Apply filters ────────────────────────────────────────── */
function applyFilters() {
  const comps = STATE.filters.components;
  const candidates = STATE.rawVersions.filter(v => {
    const ts = +new Date(v.versionTimestampLastUpdate || v.versionTimestamp || 0);
    if (!isFinite(ts) || ts < SIX_MONTHS_AGO) return false;
    if (!comps.length) return true;
    const name = norm(v.versionProductName);
    const tags = (Array.isArray(v.versionSearchTags) ? v.versionSearchTags.join(",") : "").toLowerCase();
    return comps.some(t => name.includes(t) || tags.includes(t));
  });

  const ag = computeAggregates(candidates);
  paintFixedCounts(ag);
  buildTypeButtons(ag.typeCounts);

  const filtered = candidates.filter(v => {
    const r       = redditMatchesForVersionBase(v, 6, false);
    const rr      = redditMatchesForVersionBase(v, 6, true);
    const soAll   = stackoverflowMatchesForVersionBase(v, 6, false);
    const soRiskA = stackoverflowMatchesForVersionBase(v, 6, true);
    const rLatest = rr.filter(p => p.isAboutLatestUpdate).length;
    const rCve    = rr.filter(p => p.isAboutCve).length;
    const mltlSrc = v.mltl && Array.isArray(v.mltl.src) ? v.mltl.src : [];
    const potPosts = mltlSrc.map(u => STATE.redditByUrl.get(String(u))).filter(p => p?.isAboutLatestUpdate && p?.isAboutCve);
    return matchesToggles(v, r.length, rr.length, soAll.length, soRiskA.length, rLatest, rCve, potPosts.length>0);
  });

  EL["kpi-reddit"].textContent = getSourceCounts().reddit;

  if (filtered.length) {
    const getMs = v => +new Date(v.versionTimestampLastUpdate || v.versionTimestamp || 0);
    const min = new Date(Math.min(...filtered.map(getMs)));
    const max = new Date(Math.max(...filtered.map(getMs)));
    EL["kpi-range"].innerHTML = `Range: <em>${min.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})} – ${max.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}</em>`;
  } else {
    EL["kpi-range"].innerHTML = `Range: <em>—</em>`;
  }

  STATE.groupsFiltered = groupByComponentName(filtered);
  STATE.groupIndex = 0;
  EL.feed.innerHTML = "";
  EL["kpi-page"].textContent = STATE.groupsFiltered.length;
  EL.sentinel.textContent = STATE.groupsFiltered.length ? "Loading more…" : "No results";
  EL.emptyState.classList.toggle("show", !STATE.groupsFiltered.length);
  EL.status.textContent = `${STATE.groupsFiltered.length} group${STATE.groupsFiltered.length !== 1 ? "s" : ""}`;
  appendNextGroups();
}

/* ── Chip builder ─────────────────────────────────────────── */
const chip = (t, k) => `<span class="chip ${k||""}">${t}</span>`;

/* ── Render group ─────────────────────────────────────────── */
function renderComponentNode(group) {
  const onlyRedditRisks = STATE.filters.toggles.has("reddit-risk") ||
                          STATE.filters.toggles.has("reddit-risk-latest") ||
                          STATE.filters.toggles.has("reddit-risk-cve");
  const onlySoRisks = STATE.filters.toggles.has("so-risk");

  const seen = new Set(); const rUnion = [];
  for (const v of group.items) {
    for (const p of redditMatchesForVersionBase(v, REDDIT_LIMIT, onlyRedditRisks)) {
      const id = getPostId(p); if (seen.has(id)) continue; seen.add(id); rUnion.push(p);
    }
    for (const p of stackoverflowMatchesForVersionBase(v, REDDIT_LIMIT, onlySoRisks)) {
      const id = getPostId(p); if (seen.has(id)) continue; seen.add(id); rUnion.push(p);
    }
  }

  const timeline = [];
  for (const v of group.items) {
    timeline.push({
      t: +new Date(v.versionTimestampLastUpdate || v.versionTimestamp || 0),
      kind: v.isCve ? "cve" : "update",
      channel: (v.versionReleaseChannel || "other").toLowerCase(),
      label: `${safe(v.versionProductName,"")} ${v.versionNumber||""}`.trim(),
      url: (v.versionUrl?.startsWith("http")) ? v.versionUrl : ((v.versionReleaseNotes?.startsWith("http")) ? v.versionReleaseNotes : "#"),
      raw: v
    });
  }
  for (const p of rUnion) {
    const src = getPostSource(p);
    timeline.push({ t: +new Date(p.created_utc||0), kind: src==="stackoverflow"?"stackoverflow":"reddit", channel:null, label:p.title, url:p.url, raw:p });
  }
  timeline.sort((a,b) => b.t - a.t);

  const cveCount    = timeline.filter(x => x.kind==="cve").length;
  const redditCount = timeline.filter(x => x.kind==="reddit").length;
  const soCount     = timeline.filter(x => x.kind==="stackoverflow").length;
  const majorCount  = timeline.filter(x => x.channel==="major").length;
  const minorCount  = timeline.filter(x => x.channel==="minor").length;
  const patchCount  = timeline.filter(x => x.channel==="patch").length;

  // Only show non-zero chips in the summary
  const summaryChips = [
    cveCount    ? chip(`CVE ${cveCount}`,    "bad")    : "",
    redditCount ? chip(`REDDIT ${redditCount}`, "reddit") : "",
    soCount     ? chip(`SO ${soCount}`,      "soft")   : "",
    majorCount  ? chip(`MAJOR ${majorCount}`,  "ok")   : "",
    minorCount  ? chip(`MINOR ${minorCount}`,  "soft") : "",
    patchCount  ? chip(`PATCH ${patchCount}`,  "soft") : "",
  ].filter(Boolean).join("");

  const det = document.createElement("details");
  det.className = "feedGroup";
  det.open = document.querySelectorAll(".feedGroup").length === 0;

  const sum = document.createElement("summary");
  sum.innerHTML = `${group.name}<span class="summaryRight">${summaryChips}</span>`;
  det.appendChild(sum);

  const wrap = document.createElement("div"); wrap.className = "updates";
  const list = document.createElement("div"); list.className = "list";

  for (const it of timeline) {
    const li = document.createElement("div");
    // CSS classes for color-coded border
    let liClass = "li";
    if (it.kind === "cve")                         liClass += " kind-cve";
    else if (it.kind === "reddit")                 liClass += " kind-reddit" + (isRisk(it.raw) ? " risk" : "");
    else if (it.kind === "update" && it.channel)   liClass += ` kind-update ${it.channel}`;
    li.className = liClass;

    const dcol = document.createElement("div"); dcol.className = "datecol";
    dcol.innerHTML = `<span class="day">${dayLabelFromMillis(it.t)}</span><span class="time">${shortTime(it.t)}</span>`;
    li.appendChild(dcol);

    // Avatar
    if (it.kind === "reddit") {
      const av = document.createElement("img");
      av.className = "avatar redditIcon" + (isRisk(it.raw) ? " risky" : "");
      av.src = "./img/reddit.png"; av.alt = "Reddit"; av.title = isRisk(it.raw) ? "Reddit (risk)" : "Reddit";
      li.appendChild(av);
    } else if (it.kind === "stackoverflow") {
      const av = document.createElement("img");
      av.className = "avatar soIcon" + (isRisk(it.raw) ? " risky" : "");
      av.src = "./img/stackoverflow.png"; av.alt = "StackOverflow";
      li.appendChild(av);
    } else {
      const av = document.createElement("img"); av.className = "avatar"; av.alt = group.name; av.src = avatarFor(it.raw);
      li.appendChild(av);
    }

    const body   = document.createElement("div");
    const chipsEl = document.createElement("div"); chipsEl.className = "chips";

    if (it.kind === "reddit") {
      chipsEl.insertAdjacentHTML("beforeend", chip("reddit", "reddit"));
      const scorePred = it.raw?.metadata?.predicted?.positiveScore;
      const scoreField = typeof it.raw?.score === "number" ? it.raw.score : null;
      const scoreVal = typeof scorePred === "number" ? scorePred : scoreField;
      if (isRisk(it.raw)) {
        chipsEl.insertAdjacentHTML("beforeend", chip(scoreVal != null ? `RISK ${Number(scoreVal).toFixed(2)}` : "RISK", "warn"));
      } else if (scoreVal != null) {
        chipsEl.insertAdjacentHTML("beforeend", chip(`score ${Number(scoreVal).toFixed(2)}`, "soft"));
      }
      const flags = it.raw || {};
      if (flags.isAboutLatestUpdate) chipsEl.insertAdjacentHTML("beforeend", chip("latest", "soft"));
      if (flags.isAboutCve)          chipsEl.insertAdjacentHTML("beforeend", chip("security", "bad"));
      const comments = typeof flags.num_comments === "number" ? flags.num_comments : null;
      if (comments != null) chipsEl.insertAdjacentHTML("beforeend", chip(`${comments} comments`, "soft"));
    } else if (it.kind === "stackoverflow") {
      chipsEl.insertAdjacentHTML("beforeend", chip("stackoverflow", "soft"));
      const scorePred = it.raw?.metadata?.predicted?.positiveScore;
      const scoreVal  = typeof scorePred === "number" ? scorePred : (typeof it.raw?.score === "number" ? it.raw.score : null);
      if (isRisk(it.raw)) chipsEl.insertAdjacentHTML("beforeend", chip(scoreVal != null ? `RISK ${Number(scoreVal).toFixed(2)}` : "RISK", "warn"));
    } else if (it.kind === "cve") {
      chipsEl.insertAdjacentHTML("beforeend", chip("CVE", "bad"));
      if (it.raw?._id) chipsEl.insertAdjacentHTML("beforeend", `<span class="chip link">ID <a href="https://releasetrain.io/api/v/${it.raw._id}" target="_blank" rel="noopener">open</a></span>`);
    } else {
      const ch = it.channel || "other";
      chipsEl.insertAdjacentHTML("beforeend", chip(ch, ch === "major" ? "ok" : ch === "patch" ? "soft" : "soft"));
    }

    if (it.kind !== "reddit" && it.kind !== "stackoverflow" && it.raw) {
      const r = it.raw;
      if (r.versionProductLicense) chipsEl.insertAdjacentHTML("beforeend", chip(String(r.versionProductLicense).toLowerCase(), "soft"));
      (r.classification?.componentType||[]).filter(x => x && x !== "UNKNOWN").slice(0,1)
        .forEach(t => chipsEl.insertAdjacentHTML("beforeend", chip(String(t).toLowerCase(), "soft")));
      (r.classification?.securityType||[]).filter(x => x && x !== "UNKNOWN").slice(0,1)
        .forEach(t => chipsEl.insertAdjacentHTML("beforeend", chip(String(t).toLowerCase(), "bad")));
      (r.classification?.breakingType||[]).filter(x => x && x !== "UNKNOWN").slice(0,1)
        .forEach(t => chipsEl.insertAdjacentHTML("beforeend", chip(String(t).toLowerCase(), "warn")));
      if (r._id) chipsEl.insertAdjacentHTML("beforeend", `<span class="chip link"><a href="https://releasetrain.io/api/v/${r._id}" target="_blank" rel="noopener">open</a></span>`);
    }

    body.appendChild(chipsEl);

    const titleRow = document.createElement("div"); titleRow.className = "titleRow";
    const a = document.createElement("a"); a.href = it.url || "#"; a.target = "_blank"; a.rel = "noopener"; a.textContent = it.label;
    titleRow.appendChild(a);
    body.appendChild(titleRow);

    const descTxt = truncate(safe(it.raw?.versionReleaseNotes, "")) || safe(it.raw?.versionReleaseComments, "");
    if (descTxt) {
      const d = document.createElement("div"); d.className = "meta";
      let inner = "";

      if (it.kind !== "reddit" && it.kind !== "stackoverflow" && it.raw) {
        const mltlSrc = it.raw.mltl && Array.isArray(it.raw.mltl.src) ? it.raw.mltl.src : [];
        const potPosts = mltlSrc.map(u => STATE.redditByUrl.get(String(u))).filter(p => p?.isAboutLatestUpdate && p?.isAboutCve);
        if (potPosts.length) {
          inner += `<span class="chip warn potentialCveBadge">⚠ Potential CVE discussion (${potPosts.length})</span>`;
          inner += `<div class="chips potentialCveChips">`;
          for (const p of potPosts) {
            const id = getPostId(p) || "post";
            inner += `<a class="chip potentialCveChip" href="${p.url || `https://reddit.com/comments/${id}`}" target="_blank" rel="noopener">${id}</a>`;
          }
          inner += `</div>`;
        }
      }

      d.innerHTML = inner + descTxt;
      body.appendChild(d);
    }

    li.appendChild(body);
    list.appendChild(li);
  }

  wrap.appendChild(list);
  det.appendChild(wrap);
  return det;
}

/* ── Infinite scroll ──────────────────────────────────────── */
function appendNextGroups() {
  if (STATE.loading) return;
  if (STATE.groupIndex >= STATE.groupsFiltered.length) {
    EL.sentinel.textContent = STATE.groupsFiltered.length ? "End of results" : "No results";
    return;
  }
  STATE.loading = true;
  const frag = document.createDocumentFragment();
  const end  = Math.min(STATE.groupIndex + GROUPS_BATCH, STATE.groupsFiltered.length);
  for (let i = STATE.groupIndex; i < end; i++) frag.appendChild(renderComponentNode(STATE.groupsFiltered[i]));
  EL.feed.appendChild(frag);
  STATE.groupIndex = end;
  STATE.loading = false;
}

function setupObserver() {
  if (STATE.observer) STATE.observer.disconnect();
  STATE.observer = new IntersectionObserver(es => {
    if (es[0]?.isIntersecting) appendNextGroups();
  }, { rootMargin: "400px 0px" });
  STATE.observer.observe(EL.sentinel);
}

/* ── Expand / collapse all ────────────────────────────────── */
EL.expandAllBtn.addEventListener("click", () => {
  STATE.expandedAll = !STATE.expandedAll;
  $$(".feedGroup").forEach(d => { d.open = STATE.expandedAll; });
  EL.expandAllBtn.textContent = STATE.expandedAll ? "Collapse all" : "Expand all";
});

/* ── Boot ─────────────────────────────────────────────────── */
async function boot() {
  EL.status.textContent = "Loading…";
  EL.navLoader.classList.add("active");
  EL.feed.innerHTML = "";
  EL.emptyState.classList.remove("show");
  STATE.groupIndex = 0;

  try {
    const rawQ = new URL(location.href).searchParams.get("q") || "";
    EL.components.value = rawQ;
    STATE.filters.components = tokens(rawQ);
    setLinksHref();

    const [vers, reddit] = await Promise.all([Api.versions(rawQ), Api.reddit().catch(() => [])]);
    STATE.redditAll = reddit;
    buildRedditIndex(reddit);
    EL["kpi-reddit"].textContent = getSourceCounts().reddit;

    if (!(vers||[]).length) {
      EL.status.textContent = "No versions found";
      EL.sentinel.textContent = "No results";
      EL.emptyState.classList.add("show");
      return;
    }

    vers.sort((a,b) => (+new Date(b.versionTimestampLastUpdate||b.versionTimestamp||0)) - (+new Date(a.versionTimestampLastUpdate||a.versionTimestamp||0)));
    STATE.rawVersions = vers;
    applyFilters();
  } catch (e) {
    console.error(e);
    EL.feed.innerHTML = `<p class="meta" style="padding:14px;color:var(--bad)">Error: ${e.message}</p>`;
    EL.status.textContent = "Failed to load";
  } finally {
    EL.navLoader.classList.remove("active");
  }
}

/* ── Events ───────────────────────────────────────────────── */
EL.filterForm.addEventListener("submit", async e => {
  e.preventDefault();
  const input = EL.components.value.replace(/ /g," ").replace(/\s*,\s*/g,",").trim();
  history.replaceState({}, "", buildHrefWithQ(location.pathname, input));
  setLinksHref();
  EL.status.textContent = "Filtering…";
  EL.navLoader.classList.add("active");
  try {
    STATE.filters.components = tokens(input);
    const vers = await Api.versions(input);
    if (!(vers||[]).length) {
      EL.feed.innerHTML = ""; EL.sentinel.textContent = "No results";
      EL.emptyState.classList.add("show"); EL.status.textContent = "No versions";
      return;
    }
    vers.sort((a,b) => (+new Date(b.versionTimestampLastUpdate||b.versionTimestamp||0)) - (+new Date(a.versionTimestampLastUpdate||a.versionTimestamp||0)));
    STATE.rawVersions = vers;
    applyFilters();
  } catch(e) { console.error(e); EL.status.textContent = "Filter failed"; }
  finally { EL.navLoader.classList.remove("active"); }
});

EL.clearBtn.addEventListener("click", () => {
  EL.components.value = "";
  STATE.filters.components = [];
  STATE.filters.toggles.clear();
  history.replaceState({}, "", buildHrefWithQ(location.pathname, ""));
  setLinksHref();
  $$("#fixedToggles .toggle, #typeToggles .toggle").forEach(b => b.setAttribute("aria-pressed","false"));
  refreshActiveFilters();
  boot();
});

EL.fixedToggles.addEventListener("click", e => {
  const btn = e.target.closest(".toggle");
  if (!btn || btn.classList.contains("disabled")) return;
  const key = btn.dataset.key, on = btn.getAttribute("aria-pressed") === "true";
  btn.setAttribute("aria-pressed", on ? "false" : "true");
  on ? STATE.filters.toggles.delete(key) : STATE.filters.toggles.add(key);
  refreshActiveFilters();
  applyFilters();
});

EL.afClearAll.addEventListener("click", () => {
  STATE.filters.toggles.clear();
  $$("#fixedToggles .toggle, #typeToggles .toggle").forEach(b => b.setAttribute("aria-pressed","false"));
  refreshActiveFilters();
  applyFilters();
});

setupObserver();
boot();
</script>
</body>
</html>
