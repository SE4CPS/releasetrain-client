<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ReleaseTrain Reddit Browser</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #555555;
      --line: #dcdcdc;
      --focus: #000000;
      --accent: #111111;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    a { color: inherit; text-decoration: underline; }
    a:focus, button:focus, select:focus, input:focus { outline: 2px solid var(--focus); outline-offset: 2px; }

    /* Compact header with centered pager */
    header {
      padding: 4px 8px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    header h1 { margin: 0; font-size: 14px; font-weight: 600; }
    .status { font-size: 11px; color: var(--muted); white-space: nowrap; }

    .pager {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 auto;
      font-size: 12px;
    }
    .pager button {
      border: 1px solid var(--line);
      background: var(--bg);
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .pager input {
      width: 60px;
      padding: 2px 4px;
      font-size: 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      text-align: center;
    }
    .badge { border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; font-size: 12px; color: var(--muted); }

    .countbar {
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 8px;
    }
    .count-badge {
      font-weight: 700;
      font-size: 15px;
      color: var(--accent);
      padding: 2px 10px;
      border: 2px solid var(--fg);
      border-radius: 999px;
      background: var(--bg);
    }
    .muted { color: var(--muted); }
    main { padding: 8px; }

    .toolbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 8px; margin-bottom: 10px; }
    .card { background: #f7f7f7; border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, input[type="text"] {
      width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    }

    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 2px solid var(--line);
      padding: 6px 8px;
    }
    tbody td {
      border-bottom: 1px solid var(--line);
      padding: 6px 8px;
      vertical-align: top;
    }
    .desc { white-space: pre-wrap; word-break: break-word; }
    .center { text-align: center; }
  </style>
</head>
<body>
  <header>
    <div style="width: 20%;"></div>
    <div class="pager">
      <button id="prevBtn" aria-label="Previous page">&larr;</button>
      <span class="badge">Page <span id="pageText">1</span></span>
      <button id="nextBtn" aria-label="Next page">&rarr;</button>
      <input id="limitInput" type="number" min="1" max="500" step="10" value="500" aria-label="Items per page" />
      <button id="reloadBtn" aria-label="Reload">&#x21bb;</button>
    </div>
    <div class="status" id="status" aria-live="polite">idle</div>
  </header>

  <div class="countbar" role="status" aria-live="polite">
    <div id="countBadge" class="count-badge">Showing 0 / 0</div>
    <div class="muted" id="pageInfo">Last load: 0 items</div>
  </div>

  <main>
    <!-- Filters -->
    <section class="toolbar">
      <div class="card">
        <label for="labelFilter">Label status</label>
        <select id="labelFilter">
          <option value="all">All</option>
          <option value="unlabeled">Unlabeled</option>
          <option value="labeled">Labeled</option>
          <option value="positive">Positive</option>
          <option value="negative">Negative</option>
        </select>
      </div>

      <div class="card">
        <label>Field presence</label>
        <div class="row">
          <label class="badge"><input id="withDescription" type="checkbox" /> with author_description</label>
          <label class="badge"><input id="withTitle" type="checkbox" /> with title</label>
        </div>
      </div>

      <div class="card">
        <label for="searchText">Search (title or description)</label>
        <input id="searchText" type="text" placeholder="Type to filter…" />
      </div>
    </section>

    <!-- Table -->
    <section>
      <table>
        <thead>
          <tr>
            <th style="width: 180px;">ID</th>
            <th>Title</th>
            <th>Author Description</th>
            <th style="width: 100px;">Reddit</th>
            <th style="width: 180px;">Is Update Related</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="center muted" style="padding:10px;" hidden>No posts match your filters.</div>
    </section>
  </main>

  <script>
    (function(){
      const API_BASE = 'https://releasetrain.io';
      const LIST_ENDPOINT = `${API_BASE}/api/reddit`;
      const UPDATE_ENDPOINT = (redditId) => `${API_BASE}/api/reddit/${encodeURIComponent(redditId)}`;

      const state = { page: 1, limit: 100, raw: [] };

      const statusEl = document.getElementById('status');
      const tbody = document.getElementById('tbody');
      const empty = document.getElementById('empty');
      const countBadge = document.getElementById('countBadge');
      const pageInfo = document.getElementById('pageInfo');
      const pageText = document.getElementById('pageText');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const reloadBtn = document.getElementById('reloadBtn');
      const limitInput = document.getElementById('limitInput');
      const labelFilter = document.getElementById('labelFilter');
      const withDescription = document.getElementById('withDescription');
      const withTitle = document.getElementById('withTitle');
      const searchText = document.getElementById('searchText');

      const s = v => (v === null || v === undefined) ? '' : String(v);
      const nonEmpty = v => !!s(v).trim();
      const setStatus = msg => statusEl.textContent = msg;

      const docLabel = doc => {
        const meta = doc.metadata || {};
        const val = meta.isUpdateRelated;
        if (val === true) return 'positive';
        if (val === false) return 'negative';
        return 'unlabeled';
      };
      const labelToDisplay = l => l === 'positive' ? 'Positive' : l === 'negative' ? 'Negative' : 'Not Labeled';
      const displayToLabel = d => d.toLowerCase().includes('pos') ? 'positive' : d.toLowerCase().includes('neg') ? 'negative' : 'unlabeled';

      const buildQuery = () => `${LIST_ENDPOINT}?page=${Math.max(1,state.page)}&limit=${Math.max(1,Math.min(500,state.limit))}`;

      async function fetchList() {
        setStatus('Loading…');
        tbody.innerHTML = '';
        empty.hidden = true;
        pageText.textContent = state.page;
        try {
          const res = await fetch(buildQuery());
          if (!res.ok) throw new Error(res.statusText);
          const data = await res.json();
          state.raw = Array.isArray(data) ? data : [];
          pageInfo.textContent = `Last load: ${state.raw.length} items`;
          setStatus('Loaded');
          render();
        } catch (e) {
          console.error(e);
          setStatus('Load error');
          state.raw = [];
          pageInfo.textContent = 'Last load: 0 items';
          render();
        }
      }

      function applyFilters(rows){
        const lf = labelFilter.value, q = searchText.value.trim().toLowerCase();
        const needDesc = withDescription.checked, needTitle = withTitle.checked;
        return rows.filter(doc=>{
          const lab = docLabel(doc);
          if(lf==='unlabeled' && lab!=='unlabeled') return false;
          if(lf==='labeled' && lab==='unlabeled') return false;
          if(lf==='positive' && lab!=='positive') return false;
          if(lf==='negative' && lab!=='negative') return false;
          if(needDesc && !nonEmpty(doc.author_description)) return false;
          if(needTitle && !nonEmpty(doc.title)) return false;
          if(q && !(s(doc.title).toLowerCase()+s(doc.author_description).toLowerCase()).includes(q)) return false;
          return true;
        });
      }

      function updateCounts(filtered){
        countBadge.textContent = `Showing ${filtered} / ${state.raw.length}`;
      }

      function render(){
        const rows = applyFilters(state.raw);
        tbody.innerHTML = '';
        if(!rows.length){ empty.hidden=false; updateCounts(0); return; }
        empty.hidden = true;
        updateCounts(rows.length);
        const frag=document.createDocumentFragment();
        rows.forEach(doc=>frag.appendChild(renderRow(doc)));
        tbody.appendChild(frag);
      }

      function renderRow(doc){
        const tr=document.createElement('tr');
        const rid=s(doc.redditId||doc._id||'');
        const idTd=document.createElement('td');
        const idA=document.createElement('a');
        idA.href=`${API_BASE}/api/reddit/${encodeURIComponent(rid)}`;
        idA.target='_blank';
        idA.textContent=rid||'(no id)';
        idTd.appendChild(idA);

        const titleTd=document.createElement('td');
        titleTd.textContent=s(doc.title);

        const descTd=document.createElement('td');
        const d=document.createElement('div');
        d.className='desc';
        d.textContent=s(doc.author_description);
        descTd.appendChild(d);

        const linkTd=document.createElement('td');
        if(nonEmpty(doc.url)){
          const a=document.createElement('a');
          a.href=doc.url;a.target='_blank';a.textContent='Open';
          linkTd.appendChild(a);
        }else linkTd.innerHTML='<span class="muted">n/a</span>';

        const selTd=document.createElement('td');
        const sel=document.createElement('select');
        ['Not Labeled','Positive','Negative'].forEach(t=>{
          const o=document.createElement('option');
          o.textContent=t; sel.appendChild(o);
        });
        sel.value=labelToDisplay(docLabel(doc));
        sel.addEventListener('change', async ()=>{
          const label=displayToLabel(sel.value);
          const payload={metadata:{isUpdateRelated:label==='positive'?true:label==='negative'?false:null}};
          try{
            await fetch(UPDATE_ENDPOINT(rid),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
            doc.metadata={...(doc.metadata||{}),isUpdateRelated:payload.metadata.isUpdateRelated};
            setStatus(`Saved ${sel.value}`);
          }catch(e){console.error(e);setStatus('Save failed');sel.value=labelToDisplay(docLabel(doc));}
          render();
        });
        selTd.appendChild(sel);

        [idTd,titleTd,descTd,linkTd,selTd].forEach(td=>tr.appendChild(td));
        return tr;
      }

      prevBtn.onclick=()=>{state.page=Math.max(1,state.page-1);fetchList();};
      nextBtn.onclick=()=>{state.page=Math.max(1,state.page+1);fetchList();};
      reloadBtn.onclick=fetchList;
      limitInput.onchange=()=>{const v=parseInt(limitInput.value,10);state.limit=Math.max(1,Math.min(500,v||100));fetchList();};
      [labelFilter,withDescription,withTitle].forEach(el=>el.onchange=render);
      searchText.oninput=render;

      const params=new URLSearchParams(location.search);
      const p=parseInt(params.get('page'),10);
      const l=parseInt(params.get('limit'),10);
      if(Number.isFinite(p))state.page=Math.max(1,p);
      if(Number.isFinite(l))state.limit=Math.max(1,Math.min(500,l));
      limitInput.value=state.limit;
      fetchList();
    })();
  </script>
</body>
</html>
