<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>releasetrain.io — Graph</title>
  <link rel="icon" href="https://releasetrain.io/img/favicon.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- libs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="./../lib/sigma.min.js"></script>

  <style>
    /* ==== theme aligned with main page, white text everywhere ==== */
    :root{
      --bg:#0f1115;        --panel:#171a21;     --text:#ffffff;     --muted:#c7cbd3;
      --brand:#60a5fa;     --line:#202532;      --chip:#1a1f2b;     --chipText:#ffffff;
      --focus:#a5b4fc;     --bad:#ef4444;       --warn:#f59e0b;
    }

    *{ box-sizing: border-box; }
    html,body{ height:100%; width:100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
      color:var(--text);
      background:var(--bg);
      font-size: 11px;
      overflow:hidden;
    }

    /* loading bar */
    #loadingBar{
      position: fixed;
      left:0; top:0;
      height:3px; width:0%;
      background: var(--brand);
      z-index: 2000;
      transition: width .25s ease-out, opacity .25s ease-out;
      opacity: 0;
    }

    /* layout uses full page height */
    .grid3x3{
      display:grid;
      grid-template-columns: 1fr 1.6fr 1fr;  /* left / center / right */
      grid-template-rows: auto 1fr auto;     /* top / graph(fill) / bottom(empty) */
      grid-template-areas:
        "top top top"
        "left center right"
        "emptyBL emptyBC emptyBR";
      height:100vh;           /* 100% height of page */
      width:100vw;
    }

    /* top row */
    .top{
      grid-area: top;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:6px 10px;
      border-bottom:1px solid var(--line);
      background:var(--panel);
      min-height:46px;
    }
    .top-left{
      display:flex; align-items:center; gap:8px; min-width:0;
    }
    .chips{
      display:flex; align-items:center; gap:6px;
      flex-wrap:nowrap;
      overflow:hidden;
      max-width: 48vw;
    }
    .chip{
      display:inline-flex; align-items:center; gap:6px;
      padding:3px 8px; border:1px solid var(--line); border-radius:12px;
      background:var(--chip); color:var(--chipText);
      font-size:11px; white-space:nowrap; user-select:none;
    }
    .chip .x{ font-weight:bold; opacity:.85; cursor:pointer; }
    .chip .x:hover{ opacity:1; }

    .top-mid{
      display:flex; align-items:center; gap:6px; min-width: 260px;
      flex: 1 1 auto;
    }
    .add-wrap{
      display:flex; align-items:center; gap:6px;
      border:1px solid var(--line); border-radius: 10px; padding:2px 6px;
      background:var(--bg);
    }
    #addInput{
      border:none; outline:none; background:transparent; width: 180px; font-size:11px; color:var(--text);
    }
    #addInput:focus{ outline:2px solid var(--focus); outline-offset:2px; border-radius:6px; }
    #addBtn{
      border:1px solid var(--line);
      background:var(--panel); color:var(--text);
      border-radius:8px; padding:2px 8px; font-size:11px; cursor:pointer;
    }
    #addBtn:hover{ background:var(--chip); }

    .top-right{
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
      color:var(--text);
    }
    .switch{ display:flex; align-items:center; gap:4px; font-size:11px; color:var(--text); }
    .switch input{ accent-color: var(--brand); }

    /* "Main" button styled like main page link pill */
    .linkchip{
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 10px; border-radius:999px;
      border:1px solid var(--line); background:transparent;
      color:var(--text); text-decoration:none; font-weight:700; font-size:12px; opacity:.9;
    }
    .linkchip:hover{ background:var(--chip); opacity:1; }

    /* left regulator */
    .left{
      grid-area: left;
      border-right:1px solid var(--line);
      background: var(--panel);
      padding:8px;
      overflow:auto;
      display:flex; flex-direction:column; gap:6px;
      color:var(--text);
    }
    h4{ margin:2px 0 6px; font-size: 12px; }
    .hint{ color:var(--muted); font-size:10px; margin:0 0 6px; }
    table{ width:100%; border-collapse: collapse; background:var(--panel); table-layout: fixed; color:var(--text); }
    th, td{ border:1px solid var(--line); padding:4px; text-align:left; font-size:11px; }
    th{ background:var(--chip); color:var(--chipText); }
    .row-compact td, .row-compact th { padding:3px; }
    input[type=range]{ width:100%; height:16px; }
    input[type=range]::-webkit-slider-thumb{ accent-color: var(--brand); }

    /* component type filters */
    .type-filters{
      display:flex; flex-wrap:wrap; gap:6px;
      background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px;
      max-height:140px; overflow:auto;
    }
    .type-filters label{
      display:inline-flex; align-items:center; gap:4px;
      padding:2px 6px; border:1px solid var(--line); border-radius:10px;
      background:var(--chip); color:var(--chipText);
      font-size:11px; white-space:nowrap; cursor:pointer;
    }
    .type-filters input{ margin:0; accent-color: var(--brand); }

    /* center graph fills all remaining space */
    .center{
      grid-area: center;
      background:var(--panel);
      padding:0;
      overflow:hidden;
      position: relative;
      height:100%;
    }
    #graphContainer{ position:absolute; inset:0; height:100%; width:100%; }

    /* right metrics */
    .right{
      grid-area: right;
      border-left:1px solid var(--line);
      background:var(--panel);
      padding:8px;
      overflow:auto;
      display:flex; flex-direction:column; gap:6px;
      color:var(--text);
    }

    .nowrap{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .muted{ color:var(--muted); }

    /* Mobile */
    @media (max-width: 900px){
      body{ overflow:auto; font-size:12px; }
      .grid3x3{
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(360px, 1fr) auto auto;
        grid-template-areas:
          "top"
          "center"
          "left"
          "right";
        height:100vh;
      }
      .top{ flex-wrap:wrap; gap:6px; }
      .chips{ max-width:100%; flex-wrap:wrap; }
      .top-mid{ order:3; width:100%; }
      .top-right{ order:2; width:100%; justify-content:flex-start; }
      .type-filters{ max-height:none; }
    }
    @media (max-width: 420px){
      .add-wrap{ flex:1; }
      #addInput{ width: 100%; }
      .top-left strong{ display:none; }
    }
  </style>
</head>
<body>
  <div id="loadingBar"></div>

  <div class="grid3x3">
    <div class="top">
      <div class="top-left">
        <strong style="font-size:12px;">Components:</strong>
        <div id="chipContainer" class="chips" title="Top 10 from today on load"></div>
      </div>

      <div class="top-mid">
        <div class="add-wrap" title="Type a component and press Enter or +">
          <input id="addInput" list="nameList" placeholder="Add component…" autocomplete="off" />
          <button id="addBtn">+</button>
        </div>
        <datalist id="nameList"></datalist>
      </div>

      <div class="top-right">
        <div class="switch">
          <input type="checkbox" id="toggleOnlyToday" checked>
          <label for="toggleOnlyToday">Only today</label>
        </div>
        <div class="switch">
          <input type="checkbox" id="toggleUniqueType" checked>
          <label for="toggleUniqueType">Unique type</label>
        </div>
        <div class="switch">
          <input type="checkbox" id="toggleRealOnly">
          <label for="toggleRealOnly">Real only</label>
        </div>
        <a id="homeBtn" class="linkchip" href="#" title="Back to releasetrain.io with the same query">Main ↗</a>
      </div>
    </div>

    <aside class="left">
      <h4>Component Types</h4>
      <div id="typeFilters" class="type-filters" title="Toggle which types appear in the graph"></div>
      <div class="hint">Toggle to show or hide types in the graph.</div>

      <h4>Regulator</h4>
      <div class="hint">Adjust impact weights.</div>
      <table id="regTable">
        <tr class="row-compact">
          <th class="nowrap">Attribute</th>
          <th class="nowrap">Impact</th>
        </tr>
      </table>
    </aside>

    <main class="center">
      <div id="graphContainer"></div>
    </main>

    <aside class="right">
      <h4>Ecosystem</h4>
      <table id="ecoTable">
        <tr class="row-compact">
          <th class="nowrap">Scope</th>
          <th class="nowrap" colspan="2" id="ecoTitle"></th>
        </tr>
        <tr class="row-compact">
          <td class="nowrap">Maintenance Cost</td>
          <td class="nowrap"><span id="maintenanceEquation">&sum;(attribute)</span></td>
          <td class="nowrap"><span id="maintenanceCost">0</span></td>
        </tr>
        <tr class="row-compact">
          <th class="nowrap">Attribute</th>
          <th class="nowrap">Impact</th>
          <th class="nowrap">Count</th>
        </tr>
      </table>

      <h4>Component</h4>
      <table id="componentTable">
        <tr class="row-compact">
          <th class="nowrap">Component</th>
          <th class="nowrap" id="componentTitle">Click a node</th>
        </tr>
        <tr class="row-compact"><th class="nowrap">Attribute</th><th class="nowrap">Count</th></tr>
        <tr class="row-compact"><td class="nowrap">Cost Component</td><td class="nowrap"><span id="costComponent">0</span></td></tr>
        <tr class="row-compact"><td class="nowrap">Cost Latest Version</td><td class="nowrap"><span id="costComponentVersion">0</span></td></tr>
      </table>
    </aside>
  </div>

  <script>
    /* ---------------------------- constants / utils ---------------------------- */
    const URL_API = "https://releasetrain.io/api";
    const STOPWORDS = new Set([
      "github","gitlab","bitbucket","access","can","core","enterprise","management","downloads","users",
      "union","man","tc","oss","beta","production","link","version","component"
    ]);
    const versionChannel = { major:"major", minor:"minor", patch:"patch", cve:"cve", invalid:"invalid" };

    // 24h helpers
    function nowMs(){ return Date.now(); }
    function ms(days){ return days*24*60*60*1000; }
    function yyyymmddFromDate(d){ return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"); }
    function yyyymmddOffset(days){ const d=new Date(nowMs()+ms(days)); return yyyymmddFromDate(d); }
    function isInLast24Hours(v){
      const now = nowMs();
      let t = null;
      if (v.versionReleaseEpochMs != null) t = Number(v.versionReleaseEpochMs);
      else if (v.versionReleaseEpoch != null) t = Number(v.versionReleaseEpoch)*1000;
      else if (v.versionReleaseDateISO) t = Date.parse(v.versionReleaseDateISO);
      else if (v.versionReleaseDateTime) t = Date.parse(v.versionReleaseDateTime);
      if (Number.isFinite(t)) return (now - t) >= 0 && (now - t) <= ms(1);
      const d = String(v.versionReleaseDate||"").trim();
      if (!d) return false;
      const today = yyyymmddFromDate(new Date(now));
      const yesterday = yyyymmddOffset(-1);
      return d===today || d===yesterday;
    }

    function loadingStart(){
      const bar = document.getElementById("loadingBar");
      bar.style.opacity = "1";
      bar.style.width = "15%";
      let pct = 15;
      bar._tick = setInterval(()=>{ pct=Math.min(90,pct+Math.random()*7); bar.style.width=pct+"%"; },160);
    }
    function loadingDone(){
      const bar = document.getElementById("loadingBar");
      clearInterval(bar._tick);
      bar.style.width="100%";
      setTimeout(()=>{ bar.style.opacity="0"; bar.style.width="0"; },260);
    }
    function getParam(name){ return new URLSearchParams(window.location.search).get(name); }
    function normalizeKey(name){ return String(name||"").trim().toLowerCase(); }

    function setParamComma(list){
      const seen = new Set(), dedup=[];
      for (const n of list){ const k=normalizeKey(n); if (seen.has(k)) continue; seen.add(k); dedup.push(n); }
      const params = new URLSearchParams(window.location.search);
      if(dedup.length) params.set("q", dedup.join(",")); else params.delete("q");
      // keep commas literal (no %2C)
      const qs = params.toString().replace(/%2C/g,",").replace(/\+/g," ");
      history.replaceState({}, "", window.location.pathname + (qs ? ("?"+qs) : ""));
      setMainHref();
    }
    function readQList(){
      const raw = (getParam("q")||"").split(",").map(s=>s.trim()).filter(Boolean);
      const seen = new Set(), out=[];
      for (const n of raw){ const k=normalizeKey(n); if (seen.has(k)) continue; seen.add(k); out.push(n); }
      return out;
    }
    function buildMainUrl(){
      const params = new URLSearchParams(window.location.search);
      const q = params.get("q") || "";
      if (!q) return "https://releasetrain.io/";
      const qParam = encodeURIComponent(q).replace(/%2C/gi, ","); // preserve commas
      return `https://releasetrain.io/?q=${qParam}`;
    }
    function setMainHref(){
      const a=document.getElementById("homeBtn");
      if(a) a.href = buildMainUrl();
    }
    function isRealComponent(nameLower, tagsSet){
      const n = (nameLower||"").trim().toLowerCase();
      if (!n) return false;
      if (STOPWORDS.has(n)) return false;
      if (n.length <= 2) return false;
      if (/^[0-9]+$/.test(n)) return false;
      if (/^[a-z]{1,4}$/.test(n)) return false;
      if (n.includes("sourcecodester")) return false;
      if (tagsSet && tagsSet.size && tagsSet.size < 2) return false;
      return true;
    }
    function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

    /* ---------------------------- top chips ---------------------------- */
    function renderChips(names){
      const wrap = document.getElementById("chipContainer");
      wrap.innerHTML = "";
      names.forEach(n=>{
        const div = document.createElement("div");
        div.className = "chip";
        div.dataset.name = n;
        div.innerHTML = `<span>${n}</span><span class="x" title="Remove">×</span>`;
        div.querySelector(".x").onclick = (ev)=>{ ev.stopPropagation(); removeChip(n); };
        wrap.appendChild(div);
      });
    }
    function addChip(name){
      if(!name) return;
      const cur = readQList();
      const clean = name.trim();
      if(!clean) return;
      const present = new Set(cur.map(x=>normalizeKey(x)));
      if (present.has(normalizeKey(clean))) return;
      cur.push(clean);
      const next = cur.slice(0,10);
      setParamComma(next);
      renderChips(next);
      fetchAndRender();
    }
    function removeChip(name){
      const cur = readQList();
      const idx = cur.findIndex(x => normalizeKey(x) === normalizeKey(name));
      if (idx>=0) cur.splice(idx,1);
      setParamComma(cur);
      renderChips(cur);
      fetchAndRender();
    }

    /* add box bindings */
    async function loadNameSuggestions(){
      try{
        const res = await fetch(`${URL_API}/c/names`);
        const names = await res.json();
        const dl = document.getElementById("nameList");
        dl.innerHTML = "";
        names.slice(0,1500).forEach(n=>{
          const opt = document.createElement("option");
          opt.value = n;
          dl.appendChild(opt);
        });
      }catch(e){ /* ignore */ }
    }
    function bindAddBox(){
      const input = document.getElementById("addInput");
      const btn = document.getElementById("addBtn");
      btn.addEventListener("click", ()=>{ addChip(input.value); input.value = ""; input.focus(); });
      input.addEventListener("keydown", (e)=>{ if (e.key === "Enter"){ addChip(input.value); input.value = ""; } });
    }

    /* ---------------------------- data model ---------------------------- */
    let eco = null;

    function initEcoAttributesIfNeeded(){
      if (eco && eco.attributeArrayList) return;

      eco = {
        components:{},
        edges:{},
        attributeArrayList:["component","link","version","major","minor","patch","cve","today"],
        attributeObjectList:{},
        typeSet:new Set(),
        selectedTypes:null,
        cost:0,
        tagCounts: new Map(),   // global tag frequency for common-tag thresholding
      };

      const reg = document.getElementById("regTable");
      eco.attributeArrayList.forEach(attr=>{
        const tr = document.createElement("tr");
        tr.className = "row-compact";
        tr.id = attr + "RowId";
        const initVal = (["today"].includes(attr)) ? 2 : (["link","major","minor","patch","cve","invalid","version"].includes(attr) ? 0 : 1);
        tr.innerHTML = `
          <td class="nowrap">${cap(attr)}</td>
          <td class="nowrap"><input id="factor${cap(attr)}Id" type="range" min="0" max="2" value="${initVal}" /></td>
        `;
        reg.appendChild(tr);

        eco.attributeObjectList[attr] = { factor:initVal, factorHtmlElementId:`factor${cap(attr)}Id`, count:0 };
      });

      eco.attributeArrayList.forEach(attr=>{
        const el = document.getElementById(eco.attributeObjectList[attr].factorHtmlElementId);
        el.addEventListener("input", ()=>{ recalcEcosystem(); renderGraph(); renderRightTables(); });
      });
    }

    function channelByVersion(v){
      const nums = String(v.versionNumber||"0").split(".");
      let ch = versionChannel.invalid;
      ch = (nums[1]!=0 && nums[2]==0) ? versionChannel.minor : ch;
      ch = (v.versionReleaseChannel===versionChannel.patch || nums[2]!=0) ? versionChannel.patch : ch;
      ch = (nums[1]==0 && nums[2]==0) ? versionChannel.major : ch;
      ch = (v.versionReleaseChannel===versionChannel.cve) ? versionChannel.cve : ch;
      return ch;
    }
    function setDisplayName(comp, candidate){ if (!comp.display) comp.display = candidate; }

    // Robust type extractor: checks several common fields
    function extractType(v){
      const candidates = [
        v.versionPredictedComponentType,
        v.predictedComponentType,
        v.componentType,
        v.versionComponentType,
        v.versionType,
        v.productType,
      ];
      for (const c of candidates){
        const t = String(c||"").trim();
        if (t) return t;
      }
      return "";
    }

    function transform(raw, typeByKey){
      initEcoAttributesIfNeeded();

      // reset
      eco.components = {};
      eco.edges = {};
      eco.typeSet = new Set();
      eco.tagCounts = new Map();
      eco.attributeArrayList.forEach(a=>{ eco.attributeObjectList[a].count = 0; });

      const uniqType = document.getElementById("toggleUniqueType").checked;
      const realOnly = document.getElementById("toggleRealOnly").checked;

      for (const v of raw){
        const nameRaw = (v.versionProductName || "").trim();
        if (!nameRaw) continue;

        const key = normalizeKey(nameRaw);
        const tags = new Set((v.versionSearchTags||[]).map(t=>normalizeKey(t)));
        if (realOnly && !isRealComponent(key,tags)) continue;

        if (!eco.components[key]){
          eco.components[key] = {
            id:key, label:key, display:nameRaw, color:"#bbb", x:0, y:0, size:1,
            cost:0, costLatestVersion:0,
            type:null,
            tags:new Set(), attributeObjectList:{}
          };
          eco.attributeArrayList.forEach(a=>{ eco.components[key].attributeObjectList[a] = { count:0 }; });
        }
        setDisplayName(eco.components[key], nameRaw);

        // 1) Try type from this record
        const tCandidate = normalizeKey(extractType(v)||"");
        if (tCandidate){
          if (!eco.components[key].type || uniqType){ eco.components[key].type = tCandidate; }
          eco.typeSet.add(tCandidate);
        }

        const ch = channelByVersion(v);
        eco.components[key].attributeObjectList[ch].count++;
        eco.components[key].attributeObjectList["version"].count++;
        eco.components[key].attributeObjectList["component"].count = 1;

        (v.versionSearchTags||[]).forEach(t=>{
          const nt = normalizeKey(t);
          eco.components[key].tags.add(nt);
        });

        eco.attributeObjectList[ch].count++;
        eco.attributeObjectList["version"].count++;
        eco.attributeObjectList["component"].count = Object.keys(eco.components).length;

        if (isInLast24Hours(v)){
          eco.attributeObjectList["today"].count++;
          eco.components[key].attributeObjectList["today"].count++;
        }
      }

      // 2) Backfill missing types from the full dataset map
      if (typeByKey){
        Object.keys(eco.components).forEach(k=>{
          if (!eco.components[k].type && typeByKey.has(k)){
            const t = typeByKey.get(k);
            if (t){
              eco.components[k].type = t;
              eco.typeSet.add(t);
            }
          }
        });
      }

      // Global tag frequencies across components (for "common tag" thresholding)
      const keysForTags = Object.keys(eco.components);
      for (const k of keysForTags){
        for (const t of eco.components[k].tags){
          eco.tagCounts.set(t, (eco.tagCounts.get(t)||0) + 1);
        }
      }
      const nComps = Math.max(1, keysForTags.length);
      const COMMON_THRESHOLD = 0.12; // 12%

      // edges by shared non-common tags only
      for (let i=0;i<keysForTags.length;i++){
        for (let j=i+1;j<keysForTags.length;j++){
          const A = eco.components[keysForTags[i]], B = eco.components[keysForTags[j]];
          const inter = [...A.tags]
            .filter(t=>B.tags.has(t))
            .filter(t=>{
              const freq = (eco.tagCounts.get(t)||0) / nComps;
              return freq <= COMMON_THRESHOLD &&
                     !STOPWORDS.has(t) &&
                     t!=="production" && t!=="beta" && isNaN(t);
            });
          if (inter.length>0){
            const id = `${A.id}-${B.id}`;
            eco.edges[id] = { id, source:A.id, target:B.id, weight: inter.length };
            eco.attributeObjectList["link"].count++;
            A.attributeObjectList["link"].count++;
          }
        }
      }

      renderTypeFilters();
      recalcEcosystem();
    }

    function recalcEcosystem(){
      eco.cost = 0;
      eco.attributeArrayList.forEach(a=>{
        const obj = eco.attributeObjectList[a];
        obj.factor = Number(document.getElementById(obj.factorHtmlElementId).value);
      });
      Object.keys(eco.components).forEach(k=>{
        eco.components[k].cost = 0;
        eco.components[k].costLatestVersion = 0;
      });

      const versionRelevant = new Set(["major","minor","patch","cve","today"]);
      eco.attributeArrayList.forEach(a=>{
        eco.cost += eco.attributeObjectList[a].count * eco.attributeObjectList[a].factor;
        Object.keys(eco.components).forEach(k=>{
          const comp = eco.components[k];
          const cnt = comp.attributeObjectList[a].count;
          comp.cost += cnt * eco.attributeObjectList[a].factor;
          if (versionRelevant.has(a)){
            comp.costLatestVersion += (cnt>0 ? 1 : 0) * eco.attributeObjectList[a].factor;
          }
        });
      });
    }

    /* ---------------------------- type filters (left switches) ---------------------------- */
    function renderTypeFilters(){
      const wrap = document.getElementById("typeFilters");
      wrap.innerHTML = "";

      const types = Array.from(eco.typeSet).sort();

      if (types.length === 0){
        eco.selectedTypes = null; // no types to filter; show all
        return;
      }

      if (!eco.selectedTypes){
        eco.selectedTypes = new Set(types);
      }else{
        types.forEach(t=> eco.selectedTypes.add(t));
      }

      types.forEach(t=>{
        const id = `type-${t.replace(/[^a-z0-9]+/g,'-')}`;
        const label = document.createElement("label");
        label.innerHTML = `<input type="checkbox" id="${id}" ${eco.selectedTypes.has(t) ? "checked":""}/> ${t || "unknown"}`;
        wrap.appendChild(label);
        label.querySelector("input").addEventListener("change", (e)=>{
          if (e.target.checked) eco.selectedTypes.add(t);
          else eco.selectedTypes.delete(t);
          renderGraph();
        });
      });
    }

    /* ---------------------------- render ---------------------------- */
    function renderRightTables(){
      const q = getParam("q") || "";
      document.getElementById("ecoTitle").textContent = q ? q : "Today’s top 10";

      const ecoTbl = document.getElementById("ecoTable");
      while (ecoTbl.rows.length > 3) ecoTbl.deleteRow(ecoTbl.rows.length-1);

      eco.attributeArrayList.forEach(a=>{
        const tr = ecoTbl.insertRow(-1);
        tr.className = "row-compact";
        const factor = eco.attributeObjectList[a].factor;
        const count  = eco.attributeObjectList[a].count;
        tr.innerHTML = `
          <td class="nowrap">${cap(a)}</td>
          <td class="nowrap">${factor}</td>
          <td class="nowrap">${count}</td>
        `;
      });

      document.getElementById("maintenanceCost").textContent = eco.cost;
    }

    function renderGraph(){
      const nodes=[], edges=[];
      const keysAll = Object.keys(eco.components);

      let keys;
      if (!eco.selectedTypes || eco.selectedTypes.size === 0){
        keys = keysAll.slice();
      }else{
        keys = keysAll.filter(k=>{
          const comp = eco.components[k];
          return !comp.type || eco.selectedTypes.has(comp.type);
        });
      }

      let maxCost = -Infinity;
      let maxKey = null;

      keys.forEach((k, i)=>{
        const comp = eco.components[k];
        const t = 2*Math.PI*i / Math.max(1,keys.length);
        const x = Math.round(30*Math.cos(t));
        const y = Math.round(30*Math.sin(t));

        if (comp.cost > maxCost){ maxCost = comp.cost; maxKey = k; }

        nodes.push({ id:k, label: comp.display || comp.label || k, x, y, size:1, color:"#9aa3af" });
      });

      const visibleSet = new Set(keys);
      Object.values(eco.edges).forEach(e=>{
        if (visibleSet.has(e.source) && visibleSet.has(e.target)){
          edges.push({ id:`${e.source}-${e.target}`, source:e.source, target:e.target, size: Math.min(6, Math.max(1, e.weight)), color:"#6b7280" });
        }
      });

      const costs = keys.map(k=>eco.components[k].cost);
      const minC = costs.length ? Math.min(...costs) : 0;
      const maxC = costs.length ? Math.max(...costs) : 0;
      function grayFor(cost){
        if (maxC===minC) return `rgb(180,180,180)`;
        const t = (cost - minC) / (maxC - minC);
        const v = Math.round(210 - t*140);  /* 210 -> 70 */
        return `rgb(${v},${v},${v})`;
      }
      nodes.forEach(n=>{ n.color = grayFor(eco.components[n.id].cost); });
      if (maxKey){ const winner = nodes.find(n=>n.id===maxKey); if (winner) winner.color = "#ff5050"; }

      document.getElementById("graphContainer").innerHTML = "";
      const s = new sigma({
        graph: { nodes, edges },
        renderer: { container: document.getElementById("graphContainer"), type: 'canvas' },
        settings: {
          drawLabels: true,
          labelSize: 10,
          defaultLabelSize: 10,
          /* ==== force graph labels to WHITE ==== */
          defaultLabelColor: "#ffffff",
          labelColor: "default",
          font: "system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Arial, sans-serif",
          drawEdgeLabels: false,
          batchEdgesDrawing: true,
          defaultNodeColor: "#9aa3af",
          defaultEdgeColor: "#6b7280"
        }
      });

      s.bind("clickNode", (e)=>{
        const key = e.data.node.id;
        const comp = eco.components[key];
        const disp = comp.display || comp.label || key;
        document.getElementById("componentTitle").textContent = `${disp} • cost ${comp.cost}`;
        document.getElementById("costComponent").textContent = comp.cost;
        document.getElementById("costComponentVersion").textContent = comp.costLatestVersion;
      });

      renderRightTables();
    }

    /* ---------------------------- helpers ---------------------------- */
    function top10TodayNames(versions){
      const map = new Map();
      versions.forEach(v=>{
        if (!isInLast24Hours(v)) return;
        const raw = (v.versionProductName||"").trim();
        if (!raw) return;
        const k = normalizeKey(raw);
        if (!map.has(k)) map.set(k, { count:0, display:raw });
        map.get(k).count += 1;
      });
      const sorted = [...map.entries()].sort((a,b)=>b[1].count - a[1].count).map(([k,v])=>v.display);
      const pick = sorted.slice(0,10);
      if (pick.length) return pick;
      const seen = new Set(), out=[];
      for (const v of versions){
        const raw=(v.versionProductName||"").trim(); const k=normalizeKey(raw);
        if (!raw || seen.has(k)) continue;
        seen.add(k); out.push(raw);
        if (out.length>=10) break;
      }
      return out;
    }

    /* ---------------------------- data fetch & boot ---------------------------- */
    async function fetchAndRender(){
      loadingStart();

      const components = readQList();
      const onlyToday = document.getElementById("toggleOnlyToday").checked;

      let url = `${URL_API}/v`;
      if (components.length) url += `?q=${components.join(",")}`;

      const res = await fetch(url);
      const payload = await res.json();
      const versions = Array.isArray(payload) ? payload : (payload.versions || []);

      // Build a type map from the FULL dataset (robust to last-24h filtering)
      const typeByKey = new Map();
      versions.forEach(v=>{
        const nameRaw = (v.versionProductName||"").trim();
        if (!nameRaw) return;
        const k = normalizeKey(nameRaw);
        const t = normalizeKey(extractType(v)||"");
        if (t && !typeByKey.has(k)) typeByKey.set(k, t);
      });

      const filtered = onlyToday ? versions.filter(isInLast24Hours) : versions;

      transform(filtered, typeByKey);
      renderGraph();
      loadingDone();
    }

    async function initialLoad(){
      bindAddBox();
      loadNameSuggestions();

      // set main link (keeps commas literal)
      setMainHref();
      document.getElementById("homeBtn").addEventListener("click", (e)=>{ setMainHref(); });

      const q = getParam("q") || "";
      if (q){
        const names = readQList().slice(0,10);
        renderChips(names);
        setParamComma(names);
        await fetchAndRender();
        return;
      }

      loadingStart();
      const res = await fetch(`${URL_API}/v`);
      const payload = await res.json();
      const all = Array.isArray(payload) ? payload : (payload.versions || []);
      const names = top10TodayNames(all);
      renderChips(names);
      setParamComma(names);
      loadingDone();
      await fetchAndRender();
    }

    // toggles
    document.getElementById("toggleOnlyToday").addEventListener("change", fetchAndRender);
    document.getElementById("toggleUniqueType").addEventListener("change", fetchAndRender);
    document.getElementById("toggleRealOnly").addEventListener("change", fetchAndRender);

    (async function boot(){ await initialLoad(); })();
  </script>
